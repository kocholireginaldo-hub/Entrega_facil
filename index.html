<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a6cf0"><meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrega Fácil"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>Entrega Fácil</title>
<style>
:root{--az:#2563eb;--az-2:#1d4ed8;--az2:#e8f0ff;--vd:#16a34a;--vd2:#dcfce7;--vm:#dc2626;--am:#f59e0b;--am2:#fff6e0;--ro:#e11d74;--ro2:#ffe6f0;--vi:#7c3aed;--vi2:#f0e9ff;
--bg:#f3f6fc;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--r:20px;
--sombra:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,#e6eeff 0,var(--bg) 300px) no-repeat,var(--bg);min-height:100vh}
[hidden]{display:none!important}
h1,h2{margin:.2em 0;letter-spacing:-.02em}h2{font-size:22px;font-weight:800}
.mut{color:var(--mut)}.peq{font-size:13px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);margin-top:6px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--az);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
select{appearance:none;-webkit-appearance:none;padding-right:40px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/></svg>") no-repeat right 15px center}
label{display:block;margin:12px 0;font-weight:700;font-size:13px;color:#334155;letter-spacing:.01em}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-weight:700;font-size:15px;cursor:pointer;width:100%;margin:6px 0;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .08s,box-shadow .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#3b82f6,var(--az-2));border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px rgba(37,99,235,.8)}
.btn.vd{background:linear-gradient(135deg,#22c55e,#15803d);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px rgba(22,163,74,.8)}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px rgba(220,38,38,.7)}
.btn:disabled{opacity:.55;pointer-events:none}.peqb{width:auto;min-height:38px;margin:0;font-size:14px;padding:0 16px;border-radius:999px}a.btn{text-decoration:none}
#auth{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{background:linear-gradient(160deg,#1d4ed8 0%,#2563eb 50%,#5b9bff 100%);color:#fff;padding:calc(40px + var(--st)) 24px 78px;text-align:center;border-radius:0 0 38px 38px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:230px;height:230px;right:-80px;top:-70px}.hero::after{width:170px;height:170px;left:-60px;bottom:-70px}
.logo{width:92px;height:92px;border-radius:26px;box-shadow:0 16px 32px -10px rgba(0,0,0,.5);position:relative}
.hero h1{font-size:31px;font-weight:800;margin:14px 0 4px;position:relative;letter-spacing:-.03em}.hero p{margin:0;opacity:.92;position:relative}.hero .mut{color:rgba(255,255,255,.92)}
.auth-card{background:#fff;margin:-46px 16px 20px;border-radius:28px;padding:22px 20px;box-shadow:var(--sombra),0 0 0 1px rgba(226,232,240,.7);position:relative}
#auth form{text-align:left}.auth-card .peq{text-align:center;margin:14px 0 0}
.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:calc(10px + var(--st)) 14px 10px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(226,232,240,.85)}
.top .marca{width:36px;height:36px;border-radius:11px;flex:0 0 36px;box-shadow:0 6px 14px -6px rgba(37,99,235,.7)}
#quem{flex:1;min-width:0;line-height:1.2}#quem b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quem small{display:block;font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{max-width:720px;margin:0 auto;padding:16px 16px calc(116px + var(--sb))}.view:not([hidden]){animation:fade .22s ease}
.bar{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:560px;margin:0 auto;padding:6px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border:1px solid rgba(226,232,240,.9);border-radius:28px;box-shadow:0 20px 44px -16px rgba(15,23,42,.4)}
.bar button,.bar a{border:0;background:none;min-height:58px;border-radius:22px;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;transition:background .15s,color .15s}
.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:var(--az);background:var(--az2)}.bar a:active,.bar button:active{background:var(--az2);color:var(--az)}#ir-rotas{color:#15803d}
.cal,.box,.card{background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:var(--r);box-shadow:var(--sombra)}
.cal{padding:14px}.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.calt{display:flex;flex-direction:column;align-items:center;gap:4px}
.calh b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.calh button{border:0;background:var(--az2);color:var(--az);width:44px;height:44px;border-radius:14px;font-size:22px;font-weight:700}
.calh .hojeb{width:auto;height:26px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800}
.sem,.grade{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}.sem span{font-size:11px;font-weight:800;color:var(--mut);padding:6px 0}
.dia{position:relative;aspect-ratio:1;border:0;border-radius:14px;background:transparent;color:var(--tx);padding:0;font-weight:600;font-size:15px;transition:background .12s}
.dia:active{background:var(--az2)}.dia.hoje{box-shadow:inset 0 0 0 2px var(--az);font-weight:800;color:var(--az)}
.dia.sel{background:linear-gradient(135deg,#3b82f6,var(--az-2));color:#fff;box-shadow:0 10px 18px -10px rgba(37,99,235,.9)}
.dia em{position:absolute;right:4px;top:4px;min-width:16px;height:16px;font-size:10px;font-style:normal;font-weight:800;background:var(--vd);color:#fff;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.resdia{margin:20px 2px 8px;font-size:17px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}.resdia b{font-weight:800}
.chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--az2);color:var(--az)}.chip.col{background:var(--ro2);color:var(--ro)}.chip.dev{background:var(--vi2);color:var(--vi)}.chip.esp{background:var(--am2);color:#b45309}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.card{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px;margin:12px 0;border-left:6px solid var(--az);animation:subir .28s ease both}
.card.esp{border-left-color:var(--am);background:linear-gradient(135deg,var(--am2),#fff 75%)}
.card.col{border-left-color:var(--ro);background:linear-gradient(135deg,var(--ro2),#fff 75%)}
.card.dev{border-left-color:var(--vi);background:linear-gradient(135deg,var(--vi2),#fff 75%)}
.th{width:72px;height:72px;border-radius:16px;object-fit:cover;background:#e8edf5}
.th:not([src]){background:linear-gradient(90deg,#e8edf5 25%,#f6f8fc 50%,#e8edf5 75%);background-size:200% 100%;animation:brilho 1.3s linear infinite}
.inf b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}.inf{min-width:0;overflow-wrap:anywhere}
.acts{grid-column:1/-1;display:flex;gap:8px;margin-top:2px}
.acts button{flex:1;min-height:46px;border-radius:14px;border:1.5px solid var(--bd);background:rgba(255,255,255,.9);font-weight:700;font-size:14px;color:var(--tx)}
.acts button:active{background:var(--az2)}.acts .x{flex:0 0 54px;color:var(--vm);border-color:#fecaca;background:#fff5f5}
.selo{display:inline-block;background:var(--am);color:#3b2a00;font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;margin-top:4px}
.tag{display:inline-block;background:var(--az2);color:var(--az);font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;margin-top:4px;letter-spacing:.02em}
.tag.col{background:var(--ro);color:#fff}.tag.dev{background:var(--vi);color:#fff}
.vazio{text-align:center;color:var(--mut);padding:24px 12px;font-weight:600}.box{padding:16px;margin:12px 0}
.perfil{display:flex;gap:14px;align-items:center}.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,var(--vi));color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:0 0 54px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(18px + var(--sb));animation:subirsheet .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -24px 50px -22px rgba(15,23,42,.45)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#cbd5e1;margin:-10px auto 14px}
.sheet img.foto{width:100%;border-radius:18px;margin:8px 0}.prev{width:100%;max-height:260px;object-fit:contain;border-radius:18px;margin-top:8px;background:#f1f5f9}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs button{min-height:50px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;font-weight:800;font-size:14px;line-height:1.15;color:#334155;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s,border-color .15s}
.tabs button::before{content:"";width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--cor,var(--az))}
.tabs [data-t=pickup]{--cor:var(--ro)}.tabs [data-t=return]{--cor:var(--vi)}.tabs [data-t=special]{--cor:var(--am)}
.tabs .on{background:var(--az);color:#fff;border-color:var(--az);box-shadow:0 10px 18px -10px rgba(37,99,235,.9)}.tabs .on::before{background:#fff}
.tabs .on.e{background:var(--am);border-color:var(--am);color:#3b2a00}.tabs .on.e::before{background:#3b2a00}
.tabs .on.c{background:var(--ro);border-color:var(--ro);color:#fff}.tabs .on.d{background:var(--vi);border-color:var(--vi);color:#fff}
.aviso{background:var(--am2);border:1px solid var(--am);border-radius:16px;padding:12px;font-size:14px;margin:12px 0}
.aviso.az{background:var(--az2);border-color:#93c5fd}.aviso.ro{background:var(--ro2);border-color:var(--ro)}.aviso.vi{background:var(--vi2);border-color:var(--vi)}
.err{color:var(--vm);font-weight:700;margin:8px 0}
.campo{position:relative;display:block}.campo input,.campo textarea{padding-right:58px}
.mic{position:absolute;right:5px;top:11px;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:50%;background:var(--az2);color:var(--az);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.mic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic:active{transform:scale(.94)}.mic.on{background:var(--vm);color:#fff;animation:pulso 1.2s ease-out infinite}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:18px;padding:14px;box-shadow:var(--sombra);font-size:13px;font-weight:600;color:var(--mut)}
.kpi b{font-size:28px;display:block;color:var(--az);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:2px}
.graf{display:flex;align-items:flex-end;gap:3px;height:120px;background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:18px;padding:12px 10px;box-shadow:var(--sombra)}
.graf i{flex:1;background:linear-gradient(180deg,#60a5fa,var(--az));border-radius:6px 6px 2px 2px;min-height:3px}
dl{margin:0}dt{font-size:12px;color:var(--mut);margin-top:10px;font-weight:700}dd{margin:0;font-weight:700}
#net{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 14px 0;padding:10px 14px;font-size:14px;font-weight:700;background:var(--am2);border:1px solid var(--am);border-radius:16px}
#net.off{background:#fde8e8;border-color:var(--vm)}#net button{min-height:36px;padding:0 14px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;font-weight:700}
#toast{position:fixed;left:14px;right:14px;top:calc(12px + var(--st));z-index:50;padding:14px 16px;border-radius:18px;color:#fff;font-weight:700;font-size:14px;line-height:1.35;opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 18px 36px -14px rgba(15,23,42,.55)}
#toast.show{opacity:1;transform:none}#toast.ok{background:linear-gradient(135deg,#22c55e,#15803d)}#toast.err{background:linear-gradient(135deg,#ef4444,#b91c1c)}#toast.warn{background:linear-gradient(135deg,#f59e0b,#b45309)}
#aviso{position:fixed;left:8px;right:8px;top:calc(8px + var(--st));z-index:60;background:#b42318;color:#fff;padding:10px 6px 10px 14px;border-radius:18px;font-size:14px;display:flex;gap:8px;align-items:flex-start;box-shadow:0 18px 36px -14px rgba(15,23,42,.55)}
#aviso[hidden]{display:none}#aviso-t{flex:1}#aviso-x{flex:0 0 44px;min-height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:20px;font-weight:700}
#a-status:empty,#a-err:empty{display:none}
.row>label{flex:1 1 0;min-width:0}.row>label input{min-width:0}
input[type=date],input[type=time],input[type=month]{min-width:0;font-size:15px;padding-left:12px;padding-right:10px}
#v-res .kpis .kpi:nth-child(4) b{color:#b45309}#v-res .kpis .kpi:nth-child(5) b{color:var(--ro)}#v-res .kpis .kpi:nth-child(6) b{color:var(--vi)}
@keyframes subir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes subirsheet{from{transform:translateY(36px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes brilho{to{background-position:-200% 0}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}100%{box-shadow:0 0 0 16px rgba(220,38,38,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="aviso" hidden role="alert"><span id="aviso-t"></span><button id="aviso-x" type="button" aria-label="Fechar aviso">✕</button></div>
<div id="toast" role="status"></div>
<main id="auth">
 <div class="hero"><img src="icon-192.png" class="logo" alt=""><h1>Entrega Fácil</h1><p class="mut">Registre e comprove suas entregas.</p></div>
 <div class="auth-card">
 <p id="a-status" class="mut"></p><p id="a-err" class="err" role="alert"></p><div id="a-home"><button class="btn pri" data-go="cad">Criar minha conta</button><button class="btn" data-go="log">Já tenho uma conta — Entrar</button></div>
 <form id="f-cad" hidden>
  <label>Nome completo<input name="nome" required autocomplete="name"></label>
  <label>Empresa em que trabalha<input name="empresa" required></label>
  <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
  <label>Senha (mín. 6 caracteres)<input name="senha" type="password" minlength="6" required autocomplete="new-password"></label>
  <button class="btn pri">Criar conta</button><button type="button" class="btn" data-go="home">Voltar</button>
 </form>
 <form id="f-log" hidden>
  <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
  <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
  <button class="btn pri">Entrar</button>
  <button type="button" class="btn" id="b-rec">Esqueci minha senha</button>
  <button type="button" class="btn" data-go="home">Voltar</button>
 </form>
 <p class="mut peq">A localização só é coletada com a sua permissão no navegador.</p>
 </div>
</main>
<main id="app" hidden>
 <header class="top"><img class="marca" src="icon-192.png" alt=""><h1 class="sr">Entrega Fácil</h1><div id="quem"></div><button class="btn peqb" id="b-sair">Sair</button></header>
 <div id="net" hidden></div>
 <section id="v-agenda" class="view"></section>
 <section id="v-hist" class="view" hidden></section>
 <section id="v-res" class="view" hidden></section>

  <a id="ir-rotas" href="https://jeanjs250sipriano-blip.github.io/equipecas-rotas/" aria-label="Abrir o aplicativo Equipeças Rotas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>Rotas</a>
  <button data-v="res"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>

 </nav>
</main>

<script>
/* Rede de segurança: mostra erros do aplicativo em vez de deixar a tela branca. */
function avisar(m){var a=document.getElementById("aviso");if(a){document.getElementById("aviso-t").textContent=m;a.hidden=false;}}
document.getElementById("aviso-x").onclick=function(){document.getElementById("aviso").hidden=true;};
/* Falhas de rede e do service worker (comuns sem internet) não são erros do app: não mostram tarja. */
function ruido(m){return /ServiceWorker|service-worker|Failed to fetch|NetworkError|Load failed|network|offline/i.test(m||"");}

// Funciona em Chrome/Edge no Android e em computadores; precisa de internet (o reconhecimento é feito pelo navegador na nuvem).
// Onde não existe, o botão avisa e o usuário pode usar o microfone do próprio teclado do celular.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const MIC_CONECT = new Set(["de", "do", "da", "dos", "das", "e", "em", "no", "na"]);
const micTitulo = t => t.toLowerCase().split(" ").map((w, i) => i && MIC_CONECT.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

  "network": "O ditado por voz precisa de internet.", "no-speech": "Não ouvi nada. Toque no microfone e fale de novo.", "audio-capture": "Microfone não encontrado."};
// modo: "titulo" (nomes: Oficina São José), "frase" (anotações: primeira letra maiúscula) ou vazio (texto como falado).
// padrao(): texto automático do campo (ex.: "Entrega 2"); ao começar a falar ele é substituído, sem precisar apagar.
function ligarMic(btn, alvo, modo, padrao) {
  btn.onclick = () => {
    if (!SR) { toast("Este navegador não tem ditado por voz. Use o microfone do teclado do celular.", "warn"); return; }
    if (micAtivo && micAtivo.btn === btn) { micAtivo.parar(); return; }
    pararMic();
    const r = new SR(); r.lang = "pt-BR"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    const inicio = alvo.value, ph = alvo.placeholder, eraPadrao = !!padrao && inicio.trim() !== "" && inicio.trim() === padrao();
    const est = {btn, parar: () => { try { r.stop(); } catch {} }};
    const fim = () => { btn.classList.remove("on"); btn.setAttribute("aria-pressed", "false"); alvo.placeholder = ph; if (micAtivo === est) micAtivo = null; };
    r.onstart = () => { btn.classList.add("on"); btn.setAttribute("aria-pressed", "true"); alvo.placeholder = "🎙 Ouvindo… fale agora"; };
    r.onresult = e => {
      let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + " ";
      t = t.replace(/\s+/g, " ").trim(); if (!t) return;
      const base = eraPadrao ? "" : inicio.replace(/\s+$/, "");
      if (modo === "titulo") t = micTitulo(t); else if (modo === "frase" && !base) t = t.charAt(0).toUpperCase() + t.slice(1);
      alvo.value = base ? base + " " + t : t;      // o texto automático ("Entrega 2") some assim que a pessoa começa a falar
      alvo.dispatchEvent(new Event("input", {bubbles: true}));
    };
    r.onerror = e => { const m = MIC_ERROS[e.error]; if (m) toast(m, "warn"); };
    r.onend = fim; micAtivo = est;
    try { r.start(); } catch { fim(); }
  };
}

async function fotoParaDataUrl(file) {
  if (!file?.type?.startsWith("image/")) throw new Error("Escolha um arquivo de imagem.");
  if (file.size > 25e6) throw new Error("Imagem muito grande (máximo 25 MB).");

  catch { img = await new Promise((ok, er) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => er(new Error("Não foi possível ler a imagem.")); i.src = URL.createObjectURL(file); }); }
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
  for (const [max, q] of [[1000, .65], [900, .55], [800, .45], [640, .4]]) {
    const k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");

// ===================== 4B. MODO OFFLINE (fila local em IndexedDB) =====================
// Registros feitos sem internet ficam guardados NO APARELHO (loja "pend") e são enviados sozinhos quando a conexão volta.
// A loja "cache" guarda uma cópia do perfil e da lista do usuário, para abrir o app sem internet.
const idb = (() => {
  let aberto;
  const abrir = () => aberto = aberto || new Promise((ok, er) => {
    const r = indexedDB.open("entrega-facil", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("pend", {keyPath: "id"}); r.result.createObjectStore("cache", {keyPath: "k"}); };
    r.onsuccess = () => ok(r.result); r.onerror = () => er(r.error || new Error("IndexedDB indisponível"));
  });
  const tx = async (loja, modo, fn) => { const d = await abrir(); return new Promise((ok, er) => { const t = d.transaction(loja, modo), r = fn(t.objectStore(loja)); t.oncomplete = () => ok(r && r.result); t.onerror = t.onabort = () => er(t.error); }); };
  return {put: (l, v) => tx(l, "readwrite", s => s.put(v)), del: (l, k) => tx(l, "readwrite", s => s.delete(k)), get: (l, k) => tx(l, "readonly", s => s.get(k)), todos: l => tx(l, "readonly", s => s.getAll())};
})();
const pendentesDe = async uid => { try { return (await idb.todos("pend")).filter(p => p.perfil.uid === uid); } catch { return []; } };
const itemParaLista = p => ({id: p.id, userId: p.perfil.uid, employeeNameSnapshot: p.perfil.nome, employeeEmailSnapshot: p.perfil.email, companySnapshot: p.perfil.empresa, ...p.dados, hasPhoto: true, pendente: true});
// Timestamps do Firestore não sobrevivem ao JSON: guardam-se como milissegundos e voltam com toDate().
const paraJson = v => JSON.stringify(v, function (k, x) { const o = this[k]; return o && typeof o.toDate === "function" ? {__ts: o.toDate().getTime()} : x; });
const deJson = t => JSON.parse(t, (k, x) => x && x.__ts !== undefined ? {toDate: () => new Date(x.__ts)} : x);
let dadosLocais = false, sincronizando = false;

async function carregarLista(p) {                  // servidor; se não houver conexão, a cópia local; sempre soma os pendentes
  let srv; dadosLocais = false;
  try {
    if (!navigator.onLine) throw Object.assign(new Error("offline"), {rede: true});
    srv = await comTempo(listarMinhas(p.uid), 15000, "Tempo esgotado ao carregar os registros.");
    idb.put("cache", {k: "lista:" + p.uid, v: paraJson(srv)}).catch(() => {});
  } catch (e) {
    if (!ehRede(e)) throw e;
    const c = await idb.get("cache", "lista:" + p.uid).catch(() => null); srv = c ? deJson(c.v) : []; dadosLocais = true;
  }
  const pend = await pendentesDe(p.uid); pend.forEach(x => fotos.set(x.id, Promise.resolve(x.photoData)));
  return [...srv.filter(d => !pend.some(x => x.id === d.id)), ...pend.map(itemParaLista)];
}
function atualizarRede() {
  const el = $("#net"), n = lista.filter(d => d.pendente).length, on = navigator.onLine;
  if (on && !n && !dadosLocais) { el.hidden = true; return; }

  el.innerHTML = !on ? `<span>📴 Sem internet${n ? ` — ${n} registro(s) guardado(s) no aparelho` : ". Novos registros ficam guardados no aparelho."}</span>`
    : `<span>${sincronizando ? "⏳ Enviando…" : n ? `⏳ ${n} registro(s) aguardando envio` : "⚠️ Mostrando dados salvos no aparelho"}</span><button id="net-env">${n ? "Enviar agora" : "Atualizar"}</button>`;
  const b = el.querySelector("#net-env"); if (b) b.onclick = async () => { await sincronizar(); if (dadosLocais) recarregar().catch(() => {}); };
}
async function enviarPendente(p) {
  try { await gravarEntrega(p.id, p.perfil, p.dados, p.photoData); }
  catch (e) {   // se o envio anterior já tinha chegado ao servidor, regravar é "atualização" (negada pelas regras): confirma e considera enviado
    if (e?.code === "permission-denied") { const s = await F.getDoc(F.doc(db, "deliveries", p.id)).catch(() => null); if (s?.exists() && s.data().userId === p.perfil.uid) { ofAlimentar(p.id, p.perfil, p.dados); return; } }
    throw e;

}
async function sincronizar() {
  if (sincronizando || !perfil || !auth?.currentUser || !navigator.onLine) return;

  try {
    for (const p of (await pendentesDe(perfil.uid)).sort((a, b) => a.queuedAt - b.queuedAt)) {
      try { await enviarPendente(p); await idb.del("pend", p.id); enviados++; }
      catch (e) { if (ehRede(e)) break; erros++; toast("Não foi possível enviar um registro guardado: " + msgErro(e), "err"); }
    }
  } finally { sincronizando = false; }
  if (enviados) { toast(`${enviados} registro(s) guardado(s) no aparelho foram enviados para a nuvem.`); try { await recarregar(); } catch {} }
  else atualizarRede();
}
addEventListener("online", () => { atualizarRede(); sincronizar(); });
addEventListener("offline", atualizarRede);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sincronizar(); });
setInterval(() => { if (lista.some(d => d.pendente)) sincronizar(); }, 60000);

// ===================== 5. COMPARTILHAMENTO =====================

const coordOk = d => Number.isFinite(d.latitude) && Number.isFinite(d.longitude) && Math.abs(d.latitude) <= 90 && Math.abs(d.longitude) <= 180;
const linkMapa = d => coordOk(d) ? `https://www.google.com/maps?q=${d.latitude},${d.longitude}` : null;

function textoEntrega(d, cabecalho = true) {
  const e = d.deliveryType === "special", c = d.deliveryType === "pickup", r = d.deliveryType === "return", L = [];
  if (cabecalho) L.push(c ? "COMPROVANTE DE COLETA" : r ? "COMPROVANTE DE DEVOLUÇÃO" : "COMPROVANTE DE ENTREGA", "");
  if (e) L.push("*ENTREGA ESPECIAL — REGISTRO RETROATIVO*");
  L.push(`${c ? "Coleta" : r ? "Devolução" : "Entrega"}: ${d.deliveryName}`, `Tipo: ${e ? "Entrega Especial" : c ? "Coleta" : r ? "Devolução" : "Entrega Padrão"}`, `Entregador: ${d.employeeNameSnapshot}`, `Empresa: ${d.companySnapshot}`,
    `Data${e ? " informada" : ""}: ${fmtData(d.deliveryDate)}`, `Horário${e ? " informado" : ""}: ${d.deliveryTime}`);
  if (e || d.registradoOffline) L.push(`Registro criado em: ${fmtCriado(d)}`);
  if (r) L.push(`Vendedor: ${d.vendedor || "—"}`);
  if (d.notes) L.push(`${r ? "Motivo" : "Obs."}: ${d.notes}`);
  if (coordOk(d)) L.push(`${e ? "Localização no momento do registro" : "Localização"}: ${d.latitude}, ${d.longitude}${d.accuracyMeters ? ` (precisão ~${d.accuracyMeters} m)` : ""}`, `Google Maps: ${linkMapa(d)}`);
  else L.push("Localização: não registrada");
  return L.join("\n");
}

async function enviar(texto, docs) {
  const files = [];
  for (const d of docs) { try { files.push(new File([await blobFoto(d.id)], `entrega-${d.id}.jpg`, {type: "image/jpeg"})); } catch {} }
  try {
    if (files.length && navigator.canShare?.({files})) { await navigator.share({text: texto, files}); return; }
    if (navigator.share) {
      if (docs.length) toast("Este aparelho/navegador não envia foto junto com o texto. Compartilhando só o texto.", "warn");
      await navigator.share({text: texto}); return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(texto); } catch {}
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
  toast("Texto copiado e WhatsApp aberto. Anexe a(s) foto(s) manualmente pela galeria.", "warn");
}
const compartilharEntrega = d => enviar(textoEntrega(d), [d]);
function compartilharDia(lista, data, nome) {
  const cab = `RELATÓRIO DE ENTREGAS, COLETAS E DEVOLUÇÕES — ${fmtData(data)}\nEntregador: ${nome}\nTotal: ${lista.length}\n`;
  const corpo = lista.map((d, i) => `\n--- ${i + 1} ---\n${textoEntrega(d, false)}`).join("\n");
  return enviar(cab + corpo, lista);
}

// ===================== 6. AGENDA, DETALHES, RESUMO =====================

const ordenar = (a, b) => (b.deliveryDate + b.deliveryTime).localeCompare(a.deliveryDate + a.deliveryTime);
const porHora = (a, b) => (a.deliveryDate + a.deliveryTime).localeCompare(b.deliveryDate + b.deliveryTime);

function cartao(d) {
  const e = d.deliveryType === "special", c = d.deliveryType === "pickup", r = d.deliveryType === "return";
  return `<article class="card${e ? " esp" : c ? " col" : r ? " dev" : ""}" data-id="${esc(d.id)}"><img class="th" data-i="${esc(d.id)}" alt="">
  <div class="inf"><b>${esc(d.deliveryName)}</b>${fmtData(d.deliveryDate)} às ${esc(d.deliveryTime)} ${coordOk(d) ? "📍" : ""}<br>
  ${e ? `<span class="selo">ENTREGA ESPECIAL — REGISTRO RETROATIVO</span><br><span class="mut peq">Registrado em ${esc(fmtCriado(d))}</span>` : c ? '<span class="tag col">Coleta</span>' : r ? '<span class="tag dev">Devolução</span>' : '<span class="tag">Entrega Padrão</span>'}
  ${r && d.vendedor ? `<br><span class="peq"><strong>Vendedor:</strong> ${esc(d.vendedor)}</span>` : ""}
  ${d.pendente ? '<br><span class="selo" style="background:#b45309;color:#fff">⏳ AGUARDANDO ENVIO</span>' : ""}
  ${d.employeeNameSnapshot ? `<br><span class="mut peq">${esc(d.employeeNameSnapshot)}</span>` : ""}</div>
  <div class="acts"><button data-a="ver">Detalhes</button><button data-a="sh">📤 Compartilhar</button><button data-a="del" class="x" aria-label="Excluir">🗑</button></div></article>`;
}
function miniaturas(root) {
  root.querySelectorAll("img[data-i]").forEach(async i => { try { i.src = await fotoDe(i.dataset.i); } catch { i.alt = "sem foto"; } });
}

async function excluir(d, lista, depois) {
  if (!await confirmar("Deseja realmente excluir esta entrega? Essa ação não poderá ser desfeita.", "Excluir entrega")) return;
  if (d.pendente) {   // ainda só existe no aparelho
    try { await idb.del("pend", d.id); } catch {}
    fotos.delete(d.id); lista.splice(lista.findIndex(x => x.id === d.id), 1); toast("Registro removido do aparelho (ele nunca tinha sido enviado à nuvem)."); atualizarRede(); depois(); return;
  }
  try {
    const r = await excluirEntrega(d);
    lista.splice(lista.findIndex(x => x.id === d.id), 1);
    toast(r.fotoPendente ? "Entrega excluída, mas a fotografia não pôde ser removida agora. Será tentado de novo no próximo acesso." : "Entrega excluída.", r.fotoPendente ? "warn" : "ok");
  } catch (e) { toast("Não foi possível excluir: " + msgErro(e), "err"); }
  depois();
}

function detalhes(d, lista, depois) {
  const e = d.deliveryType === "special", c = d.deliveryType === "pickup", r = d.deliveryType === "return", reg = d.locationKind === "registro", mapa = linkMapa(d);
  const s = abrirModal(`${e ? '<span class="selo">ENTREGA ESPECIAL — REGISTRO RETROATIVO</span>' : c ? '<span class="tag col">Coleta</span>' : r ? '<span class="tag dev">Devolução</span>' : '<span class="tag">Entrega Padrão</span>'}
  <h2>${esc(d.deliveryName)}</h2><img class="foto" data-i="${esc(d.id)}" alt="Fotografia da entrega">
  ${d.pendente ? '<p class="aviso">⏳ Este registro está guardado só neste aparelho e ainda não foi enviado à nuvem.</p>' : ""}
  <dl><dt>Entregador</dt><dd>${esc(d.employeeNameSnapshot)}</dd><dt>Empresa</dt><dd>${esc(d.companySnapshot)}</dd>
  <dt>Data e horário ${e ? "informados" : ""}</dt><dd>${fmtData(d.deliveryDate)} às ${esc(d.deliveryTime)}</dd>
  <dt>Instante real do registro</dt><dd>${esc(fmtCriado(d))}</dd>
  ${r ? `<dt>Vendedor</dt><dd>${esc(d.vendedor || "—")}</dd>` : ""}${d.notes ? `<dt>${r ? "Motivo da devolução" : "Observações"}</dt><dd>${esc(d.notes)}</dd>` : ""}
  <dt>${reg ? "Localização no momento do registro" : c ? "Localização da coleta" : r ? "Localização da devolução" : "Localização da entrega"}</dt>
  <dd>${coordOk(d) ? `${d.latitude}, ${d.longitude}${d.accuracyMeters ? ` (precisão ~${d.accuracyMeters} m)` : ""}` : "Não registrada"}</dd></dl>
  ${reg ? '<p class="aviso">Esta localização corresponde ao momento em que o registro foi criado e não comprova o local da entrega ocorrida antes.</p>' : ""}
  ${mapa ? `<a class="btn" href="${mapa}" target="_blank" rel="noopener">🗺 Ver no Google Maps</a>` : ""}
  <button class="btn vd" data-a="sh">📤 Compartilhar comprovante</button><button class="btn red" data-a="del">🗑 Excluir entrega</button><button class="btn" data-a="fx">Fechar</button>`);
  miniaturas(s);
  s.onclick = ev => {
    const a = ev.target.closest("[data-a]")?.dataset.a;
    if (a === "fx") fecharModal(); else if (a === "sh") compartilharEntrega(d); else if (a === "del") excluir(d, lista, depois);

}

// Trata cliques nos cartões; devolve true se tratou
function acaoCartao(ev, lista, depois) {
  const b = ev.target.closest("[data-a]"), c = ev.target.closest(".card");
  if (!b || !c) return false;
  const d = lista.find(x => x.id === c.dataset.id); if (!d) return true;
  if (b.dataset.a === "ver") detalhes(d, lista, depois); else if (b.dataset.a === "sh") compartilharEntrega(d); else if (b.dataset.a === "del") excluir(d, lista, depois);
  return true;
}

function chipsDoDia(l) {                           // quantos registros de cada tipo no dia
  const T = {standard: ["", "Entrega", "Entregas"], pickup: ["col", "Coleta", "Coletas"], return: ["dev", "Devolução", "Devoluções"], special: ["esp", "Especial", "Especiais"]};
  return Object.entries(T).map(([k, [c, u, pl]]) => { const n = l.filter(d => d.deliveryType === k).length; return n ? `<span class="chip ${c}">${n} ${n > 1 ? pl : u}</span>` : ""; }).join("");
}
function montarAgenda(root, lista, o = {}) {
  const hj = new Date(), st = {y: hj.getFullYear(), m: hj.getMonth(), sel: isoData(hj)};
  const draw = () => {
    const cont = {}; lista.forEach(d => cont[d.deliveryDate] = (cont[d.deliveryDate] || 0) + 1);
    const prim = new Date(st.y, st.m, 1).getDay(), n = new Date(st.y, st.m + 1, 0).getDate(); let cel = "";
    for (let i = 0; i < prim; i++) cel += "<i></i>";
    for (let i = 1; i <= n; i++) { const iso = `${st.y}-${p2(st.m + 1)}-${p2(i)}`;
      cel += `<button class="dia${iso === isoData(hj) ? " hoje" : ""}${iso === st.sel ? " sel" : ""}" data-dia="${iso}">${i}${cont[iso] ? `<em>${cont[iso]}</em>` : ""}</button>`; }
    const doDia = lista.filter(d => d.deliveryDate === st.sel).sort(porHora);
    root.innerHTML = `<div class="cal"><div class="calh"><button data-mes="-1" aria-label="Mês anterior">‹</button><span class="calt"><b>${MESES[st.m]} ${st.y}</b><button class="hojeb" data-hoje type="button">Hoje</button></span><button data-mes="1" aria-label="Próximo mês">›</button></div>
    <div class="sem">${[..."DSTQQSS"].map(x => `<span>${x}</span>`).join("")}</div><div class="grade">${cel}</div></div>
    <p class="resdia"><b>${fmtData(st.sel)}</b> — ${doDia.length} registro(s) ${chipsDoDia(doDia)}</p>
    <div class="row">${o.onNova ? '<button class="btn pri" data-nova>＋ Nova entrega</button>' : ""}${doDia.length ? '<button class="btn vd" data-rel>📤 Relatório do dia</button>' : ""}</div>
    ${doDia.map(cartao).join("") || '<p class="vazio">Nenhuma entrega neste dia.</p>'}`;
    miniaturas(root);
  };
  root.onclick = ev => {
    if (acaoCartao(ev, lista, draw)) return;
    const t = ev.target.closest("button"); if (!t) return;
    if ("hoje" in t.dataset) { st.y = hj.getFullYear(); st.m = hj.getMonth(); st.sel = isoData(hj); draw(); }
    else if (t.dataset.mes) { st.m += +t.dataset.mes; if (st.m < 0) { st.m = 11; st.y--; } if (st.m > 11) { st.m = 0; st.y++; } draw(); }
    else if (t.dataset.dia) { st.sel = t.dataset.dia; draw(); }
    else if ("nova" in t.dataset) o.onNova(st.sel);
    else if ("rel" in t.dataset) { const l = lista.filter(d => d.deliveryDate === st.sel).sort(porHora); compartilharDia(l, st.sel, l[0].employeeNameSnapshot); }
  };
  draw(); return draw;
}

function montarResumo(root, lista) {
  const hj = new Date(); let dia = isoData(hj), mes = dia.slice(0, 7);
  const draw = () => {
    const noMes = lista.filter(d => d.deliveryDate.startsWith(mes)), noDia = lista.filter(d => d.deliveryDate === dia);
    const [y, m] = mes.split("-").map(Number), n = new Date(y, m, 0).getDate(), dec = (y === hj.getFullYear() && m === hj.getMonth() + 1) ? hj.getDate() : n;
    const por = Array.from({length: n}, (_, i) => noMes.filter(d => d.deliveryDate === `${mes}-${p2(i + 1)}`).length), max = Math.max(1, ...por);
    root.innerHTML = `<h2>Resumo</h2><div class="row"><label>Dia<input type="date" id="r-d" value="${dia}"></label><label>Mês<input type="month" id="r-m" value="${mes}"></label></div>
    <div class="kpis"><div class="kpi"><b>${noDia.length}</b>Registros no dia</div><div class="kpi"><b>${noMes.length}</b>Registros no mês</div>
    <div class="kpi"><b>${noDia.filter(d => d.deliveryType === "standard").length}</b>Padrão (dia)</div><div class="kpi"><b>${noDia.filter(d => d.deliveryType === "special").length}</b>Especiais (dia)</div><div class="kpi"><b>${noDia.filter(d => d.deliveryType === "pickup").length}</b>Coletas (dia)</div><div class="kpi"><b>${noDia.filter(d => d.deliveryType === "return").length}</b>Devoluções (dia)</div>
    <div class="kpi"><b>${(noMes.length / dec).toFixed(1).replace(".", ",")}</b>Média diária (mês)</div></div>
    <p class="mut peq">Registros por dia — ${MESES[m - 1]} ${y}</p><div class="graf">${por.map((v, i) => `<i style="height:${v / max * 100}%" title="Dia ${i + 1}: ${v}"></i>`).join("")}</div>`;
    root.querySelector("#r-d").onchange = e => { if (e.target.value) { dia = e.target.value; mes = dia.slice(0, 7); draw(); } };
    root.querySelector("#r-m").onchange = e => { if (e.target.value) { mes = e.target.value; draw(); } };
  };
  draw(); return draw;
}

// ===================== 7. NOVA ENTREGA =====================

const posicao = () => new Promise((ok, er) => {
  if (!navigator.geolocation) return er(new Error("Este navegador não oferece localização."));
  navigator.geolocation.getCurrentPosition(
    p => ok({latitude: p.coords.latitude, longitude: p.coords.longitude, accuracyMeters: Math.round(p.coords.accuracy)}),
    e => er(new Error(e.code === 1 ? "Permissão de localização negada. Permita a localização para este site nas configurações do navegador (iPhone: Ajustes > Privacidade e Segurança > Serviços de Localização > Safari) e tente novamente."
      : e.code === 3 ? "Tempo esgotado ao obter a localização. Vá para um local aberto e tente novamente." : "Não foi possível obter a localização.")),
    {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
});

function abrirNova(perfil, lista, aoSalvar, dataSel) {
  let tipo = "standard", arquivo = null, obs = "", vend = "", dataOc = dataSel || isoData(new Date()), hora = "08:00", msg = "";
  const s = abrirModal("");
  const NOME = {standard: "Entrega", pickup: "Coleta", return: "Devolução"};
  const nomePadrao = () => tipo === "special" ? "Entrega Especial" : `${NOME[tipo]} ${lista.filter(d => d.deliveryType === tipo && d.deliveryDate === isoData(new Date())).length + 1}`;
  let nome = nomePadrao();
  const draw = () => {
    pararMic();
    const e = tipo === "special", c = tipo === "pickup", r = tipo === "return", alvo = r ? "devolução" : c ? "coleta" : "entrega";
    s.innerHTML = `<div class="tabs"><button data-t="standard" class="${tipo === "standard" ? "on" : ""}">Entrega Padrão</button><button data-t="pickup" class="${c ? "on c" : ""}">Coleta</button><button data-t="return" class="${r ? "on d" : ""}">Devolução</button><button data-t="special" class="${e ? "on e" : ""}">Entrega Especial</button></div>
    ${e ? '<p class="aviso"><b>ENTREGA ESPECIAL — REGISTRO RETROATIVO.</b> Para entregas já realizadas e não registradas na hora. Data e horário abaixo são informados por você; o instante real do registro é guardado separadamente.</p>'
      : c ? '<p class="aviso ro"><b>COLETA.</b> Data, horário e localização serão capturados automaticamente ao salvar.</p>'
      : r ? '<p class="aviso vi"><b>DEVOLUÇÃO.</b> Fotografe o produto devolvido e informe o vendedor. Data, horário e localização são capturados automaticamente ao salvar.</p>'
      : '<p class="aviso az">Data, horário e localização serão capturados automaticamente ao salvar.</p>'}
    <label>Nome ${r ? "da devolução" : c ? "da coleta" : "da entrega"}${campoMic(`<input id="n-nome" value="${esc(nome)}" placeholder="${r ? "Ex.: Devolução Sul Diesel" : "Nome do estabelecimento"}" autocomplete="off">`, "n-nome", "titulo")}</label>
    ${r ? `<label>Vendedor (quem vendeu a peça) *${campoMic(`<input id="n-vend" value="${esc(vend)}" placeholder="Nome do vendedor" autocomplete="off">`, "n-vend", "titulo")}</label>
    <label>Motivo / descrição (o que aconteceu)${campoMic(`<textarea id="n-obs" rows="3" placeholder="Ex.: Cliente não quis a peça / peça veio errada">${esc(obs)}</textarea>`, "n-obs", "frase")}</label>` : ""}
    ${e ? `<label>Data da ocorrência<input type="date" id="n-data" value="${dataOc}"></label><label>Horário<input type="time" id="n-hora" value="${hora}"></label>
    <label>Observações (opcional)${campoMic(`<textarea id="n-obs" rows="2">${esc(obs)}</textarea>`, "n-obs", "frase")}</label>` : ""}
    <label class="btn" for="f-cam">📷 ${arquivo ? "Tirar outra fotografia" : r ? "Fotografar o produto devolvido" : "Tirar fotografia"}</label>
    <input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
    ${e ? '<label class="btn" for="f-gal">🖼 Escolher da galeria</label><input type="file" id="f-gal" accept="image/*" hidden>' : ""}
    ${arquivo ? '<img class="prev" id="prev" alt="Prévia">' : '<p class="mut peq">A fotografia é obrigatória.</p>'}
    <p class="err" id="n-err">${esc(msg)}</p>
    <button class="btn pri" id="n-salvar">Salvar ${alvo}</button><button class="btn" id="n-cancel">Cancelar</button>`;
    if (arquivo) s.querySelector("#prev").src = URL.createObjectURL(arquivo);
    s.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const antigo = nomePadrao(); guardar(); const trocou = nome === antigo; tipo = b.dataset.t; if (trocou) nome = nomePadrao(); msg = ""; draw(); });
    s.querySelectorAll("input[type=file]").forEach(i => i.onchange = () => { guardar(); if (i.files[0]) { arquivo = i.files[0]; msg = ""; draw(); } });
    s.querySelector("#n-cancel").onclick = fecharModal;
    s.querySelector("#n-salvar").onclick = salvar;
    ligarMics(s, {"n-nome": nomePadrao});             // microfone: ao falar, o nome automático ("Entrega 2") é substituído
  };
  function guardar() {
    nome = s.querySelector("#n-nome").value;
    if (tipo === "special") { dataOc = s.querySelector("#n-data").value; hora = s.querySelector("#n-hora").value; obs = s.querySelector("#n-obs").value; }
    if (tipo === "return") { vend = s.querySelector("#n-vend").value; obs = s.querySelector("#n-obs").value; }
  }
  async function salvar() {
    guardar(); const e = tipo === "special", c = tipo === "pickup", r = tipo === "return", alvo = r ? "devolução" : c ? "coleta" : "entrega";
    const btn = s.querySelector("#n-salvar"), er = s.querySelector("#n-err");
    const falha = m => { msg = m; er.textContent = m; btn.disabled = false; btn.textContent = "Salvar " + alvo; };
    if (!nome.trim()) return falha(`Informe o nome da ${alvo}.`);
    if (r && !vend.trim()) return falha("Informe o nome do vendedor.");
    if (!arquivo) return falha("A fotografia é obrigatória.");
    if (e && (!dataOc || !hora)) return falha("Informe a data e o horário da ocorrência.");
    btn.disabled = true; btn.textContent = "Obtendo localização e salvando…"; er.textContent = "";
    try {
      let loc = null;
      try { loc = await posicao(); } catch (x) { if (!e) throw x; toast(x.message + " O registro especial será salvo sem localização.", "warn"); }
      const agora = new Date();
      const dados = {deliveryName: nome.trim(), deliveryType: tipo, deviceCreatedAt: agora, notes: (e || r) ? obs.trim() : "", ...(r ? {vendedor: vend.trim()} : {}),
        deliveryDate: e ? dataOc : isoData(agora), deliveryTime: e ? hora : horaHM(agora), occurredAt: e ? new Date(`${dataOc}T${hora}`) : agora,
        latitude: loc?.latitude ?? null, longitude: loc?.longitude ?? null, accuracyMeters: loc?.accuracyMeters ?? null, locationKind: loc ? (e ? "registro" : "entrega") : null};
      const photoData = await fotoParaDataUrl(arquivo), id = novoId();
      const snap = {uid: perfil.uid, nome: perfil.nome, email: perfil.email, empresa: perfil.empresa};
      let local = !navigator.onLine;                // sem internet: vai direto para a fila do aparelho
      if (!local) { try { await gravarEntrega(id, snap, dados, photoData); } catch (x) { if (!ehRede(x)) throw x; local = true; } }
      if (local) {
        try { await idb.put("pend", {id, queuedAt: Date.now(), perfil: snap, dados: {...dados, registradoOffline: true}, photoData}); }
        catch { throw new Error("Sem internet e não foi possível guardar no aparelho (armazenamento indisponível)."); }
      }
      fecharModal(); await aoSalvar();
      try { navigator.vibrate?.(local ? [30, 60, 30] : 40); } catch {}   // vibração curta de confirmação (Android)
      const rot = e ? "Entrega especial" : c ? "Coleta" : r ? "Devolução" : "Entrega";
      if (local) { toast(rot + " guardada NO APARELHO (sem internet). Ainda NÃO está na nuvem: será enviada sozinha quando a conexão voltar.", "warn"); return; }

        : `${rot} registrada com sucesso! Fotografia, data, horário e localização foram registrados.`);
    } catch (x) { falha(msgErro(x) + " O registro NÃO foi confirmado. Você pode tentar novamente."); }
  }

}

// ===================== 8B. BASE INTELIGENTE DE OFICINAS (NOVO) =====================
// Alimentada em segundo plano SOMENTE depois que uma entrega foi confirmada na nuvem (gravarEntrega). Nunca lança erro e nunca é aguardada:
// qualquer falha aqui não afeta o salvamento. Coleção própria (oficinas_inteligentes); as coleções existentes não são tocadas.
// OF-BEGIN
const OF = {
  COL: "oficinas_inteligentes",        // um documento por estabelecimento único
  COL_EV: "oficinas_eventos",          // um marcador por entrega já contabilizada (idempotência: repetir o evento não soma de novo)
  RAIO_NOME_IGUAL_M: 150,              // mesmo nome normalizado até esta distância = mesmo estabelecimento (desvio normal do GPS)
  RAIO_NOME_IGUAL_REVISAO_M: 500,      // mesmo nome entre 150 m e 500 m: cadastra separado, mas marca para revisão
  RAIO_PROXIMO_M: 50,                  // "coordenadas praticamente iguais" (tolerância geográfica inicial, conservadora)
  RAIO_REVISAO_M: 150,                 // nome parecido até aqui (sem fusão automática): marca para revisão
  RAIO_MESMO_PONTO_M: 15,              // nome diferente no mesmo ponto: marca para revisão (pode ser outra loja no mesmo prédio)
  SIM_FUSAO: 0.88,                     // semelhança mínima de escrita para fundir (exige também ≤ RAIO_PROXIMO_M e travas extras)
  SIM_REVISAO: 0.80,                   // semelhança mínima para marcar "possível duplicidade"
  PRECISAO_MAX_M: 100,                 // GPS pior que isso não alimenta a base
  CELULA_GRAUS: 0.002,                 // grade geográfica (~200 m) usada como índice de busca; vizinhas (3x3) cobrem os raios acima
  MAX_CAND: 50, MAX_TENT: 12, MAX_FILA: 500, PAG: 50, LOTE_EXPORT: 500, NOVOS_DIAS: 7
};

// ---------- 1. Normalização e comparação (funções puras) ----------
const ofNormalizar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/&/g, " e ").replace(/[^a-z0-9]+/g, " ").trim().replace(/\s+/g, " ");
const OF_TIPO_INICIAL = /^(entrega|coleta|devolucao) (.+)$/;
const OF_GENERICO = /^(entrega|coleta|devolucao)( especial)?( (n|no|num|numero))?( \d+)?$/;   // nomes automáticos do app ("Entrega 3"): não são estabelecimentos
const OF_CONECTIVOS = new Set(["de", "do", "da", "dos", "das", "e"]);
function ofNomeDaEntrega(bruto) {                  // devolve {nome, nn} ou null quando o nome não identifica um estabelecimento
  const limpo = String(bruto ?? "").replace(/\s+/g, " ").trim(); let nn = ofNormalizar(limpo);
  if (nn.length < 3 || /^[\d ]+$/.test(nn) || OF_GENERICO.test(nn)) return null;
  let nome = limpo; const m = nn.match(OF_TIPO_INICIAL);
  if (m) { nn = m[2]; nome = limpo.replace(/^\S+\s+/, "").replace(/^[\s\-–:.,]+/, ""); }   // "Devolução Sul Diesel" -> "Sul Diesel"
  if (nn.length < 3 || /^[\d ]+$/.test(nn)) return null;
  return {nome: nome.slice(0, 120), nn: nn.slice(0, 120)};
}
function ofLev(a, b) {                             // distância de Levenshtein
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let p = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const c = [i];
    for (let j = 1; j <= b.length; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    p = c;
  }
  return p[b.length];
}
const ofSemConectivos = s => s.split(" ").filter(w => !OF_CONECTIVOS.has(w)).join(" ");
function ofSimilaridade(a, b) {                    // 0..1 (1 = idênticos, ignorando conectivos como "do", "de")
  const x = ofSemConectivos(a), y = ofSemConectivos(b); if (!x || !y) return 0;
  return 1 - ofLev(x, y) / Math.max(x.length, y.length);
}
function ofPodeFundir(a, b) {                      // travas extras para fusão automática
  const x = ofSemConectivos(a), y = ofSemConectivos(b);
  if (Math.min(x.length, y.length) < 8) return x === y;                                   // nomes curtos: só idênticos
  if ((x.match(/\d+/g) || []).join(",") !== (y.match(/\d+/g) || []).join(",")) return false;   // "Central 1" ≠ "Central 2"
  return Math.abs(x.split(" ").length - y.split(" ").length) <= 1;                        // quantidade de palavras compatível
}
function ofDist(la1, lo1, la2, lo2) {              // Haversine, em metros
  const R = 6371000, t = x => x * Math.PI / 180, dLa = t(la2 - la1), dLo = t(lo2 - lo1);
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(t(la1)) * Math.cos(t(la2)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
const ofCelula = (la, lo) => `${Math.floor(la / OF.CELULA_GRAUS)}_${Math.floor(lo / OF.CELULA_GRAUS)}`;
function ofCelulasVizinhas(la, lo) {
  const i = Math.floor(la / OF.CELULA_GRAUS), j = Math.floor(lo / OF.CELULA_GRAUS), r = [];
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) r.push(`${i + a}_${j + b}`);
  return r;
}
function ofHash(s) {                               // cyrb53: id determinístico (mesmo nome => mesmo id)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

// ---------- 2. O que pode alimentar a base ----------
function ofItemDeEntrega(entregaId, snap, d) {     // null = esta entrega não alimenta a base (a entrega em si segue normal)
  if (!entregaId || !snap?.uid || !d) return null;
  if (!["standard", "pickup", "return"].includes(d.deliveryType)) return null;   // especial é retroativa: o GPS é do momento do registro, não do estabelecimento
  if (d.locationKind !== "entrega") return null;
  const la = d.latitude, lo = d.longitude;
  if (typeof la !== "number" || typeof lo !== "number" || !Number.isFinite(la) || !Number.isFinite(lo)) return null;
  if (Math.abs(la) > 90 || Math.abs(lo) > 180 || (Math.abs(la) < 1e-4 && Math.abs(lo) < 1e-4)) return null;
  const prec = d.accuracyMeters; if (!Number.isFinite(prec) || prec > OF.PRECISAO_MAX_M) return null;
  const n = ofNomeDaEntrega(d.deliveryName); if (!n) return null;
  return {entregaId, uid: snap.uid, nome: n.nome, nn: n.nn, lat: la, lng: lo, prec, t: 0};
}

// ---------- 3. Decisão (pura): atualizar existente ou cadastrar novo ----------
function ofDecidir(it, cands) {
  const infos = cands.map(c => ({c, d: ofDist(it.lat, it.lng, c.latitude, c.longitude), igual: c.nomeNormalizado === it.nn,
    s: c.nomeNormalizado === it.nn ? 1 : ofSimilaridade(it.nn, c.nomeNormalizado)})).filter(x => Number.isFinite(x.d));
  const porDist = (a, b) => a.d - b.d;
  // 1) nome normalizado idêntico (e no mesmo lugar): já existe
  const iguais = infos.filter(x => x.igual && x.d <= OF.RAIO_NOME_IGUAL_M).sort(porDist);
  if (iguais.length) return {acao: "atualizar", id: iguais[0].c.id, d: iguais[0].d};
  // 2) nome muito parecido + coordenadas praticamente iguais + travas: mesmo estabelecimento, escrita diferente
  const fund = infos.filter(x => !x.igual && x.s >= OF.SIM_FUSAO && x.d <= OF.RAIO_PROXIMO_M && ofPodeFundir(it.nn, x.c.nomeNormalizado)).sort(porDist);
  if (fund.length) return {acao: "atualizar", id: fund[0].c.id, d: fund[0].d, variacao: it.nome};
  // 3-6) sem fusão: cadastra como novo; quando houver dúvida, marca para revisão administrativa
  const rev = infos.map(x => {
    if (x.igual && x.d <= OF.RAIO_NOME_IGUAL_REVISAO_M) return {x, m: "mesmo_nome_distante"};
    if (!x.igual && x.s >= OF.SIM_REVISAO && x.d <= OF.RAIO_REVISAO_M) return {x, m: "nome_semelhante"};
    if (!x.igual && x.d <= OF.RAIO_MESMO_PONTO_M) return {x, m: "mesmo_ponto_nome_diferente"};
    return null;
  }).filter(Boolean).sort((a, b) => a.x.d - b.x.d)[0];
  return rev ? {acao: "novo", revisarCom: rev.x.c.id, motivo: rev.m} : {acao: "novo"};
}

// ---------- 4. Firestore: candidatos e gravação transacional ----------
async function ofCandidatos(it) {                  // só a vizinhança (mesmo nome + células próximas), nunca a base inteira
  const col = F.collection(db, OF.COL), mapa = new Map();
  const [a, b] = await Promise.all([
    F.getDocsFromServer(F.query(col, F.where("nomeNormalizado", "==", it.nn), F.limit(OF.MAX_CAND))),
    F.getDocsFromServer(F.query(col, F.where("celula", "in", ofCelulasVizinhas(it.lat, it.lng)), F.limit(OF.MAX_CAND)))
  ]);
  [...a.docs, ...b.docs].forEach(s => mapa.set(s.id, {id: s.id, ...s.data()}));
  return [...mapa.values()];
}
// Transação: o marcador da entrega + o documento do estabelecimento. Dois funcionários ao mesmo tempo: o id do 1º cadastro com um nome é
// determinístico, então a segunda transação enxerga o documento criado pela primeira e apenas atualiza (sem duplicar).
async function ofGravar(it, dec) {
  return F.runTransaction(db, async tx => {
    const evRef = F.doc(db, OF.COL_EV, it.entregaId);
    if ((await tx.get(evRef)).exists()) return "ja_contabilizada";
    let alvo = null, criar = null;
    if (dec.acao === "atualizar") { const r = F.doc(db, OF.COL, dec.id), s = await tx.get(r); if (s.exists()) alvo = {ref: r, data: s.data()}; }
    if (!alvo) {
      const idBase = "n_" + ofHash(it.nn), rb = F.doc(db, OF.COL, idBase), sb = await tx.get(rb);
      if (!sb.exists()) criar = rb;
      else if (sb.data().nomeNormalizado === it.nn && ofDist(it.lat, it.lng, sb.data().latitude, sb.data().longitude) <= OF.RAIO_NOME_IGUAL_M) alvo = {ref: rb, data: sb.data()};
      else { const rc = F.doc(db, OF.COL, idBase + "_" + ofCelula(it.lat, it.lng)), sc = await tx.get(rc); if (sc.exists()) alvo = {ref: rc, data: sc.data()}; else criar = rc; }
    }
    let oficinaId;
    if (alvo) {
      const dd = alvo.data, up = {ultimaIdentificacao: F.serverTimestamp(), ocorrencias: (Number(dd.ocorrencias) || 0) + 1};
      const v = Array.isArray(dd.variacoesNome) ? dd.variacoesNome : [];
      if (dec.variacao && dec.variacao !== dd.nome && !v.includes(dec.variacao) && v.length < 5) up.variacoesNome = [...v, dec.variacao];
      if (ofDist(it.lat, it.lng, dd.latitude, dd.longitude) > OF.RAIO_PROXIMO_M) up.divergencias = (Number(dd.divergencias) || 0) + 1;   // coordenadas consolidadas nunca são sobrescritas
      tx.update(alvo.ref, up); oficinaId = alvo.ref.id;
    } else {
      tx.set(criar, {nome: it.nome, nomeNormalizado: it.nn, latitude: it.lat, longitude: it.lng, celula: ofCelula(it.lat, it.lng), precisaoM: it.prec,
        primeiroRegistro: F.serverTimestamp(), ultimaIdentificacao: F.serverTimestamp(), ocorrencias: 1, origem: "entrega_facil",
        revisar: !!dec.revisarCom, ...(dec.revisarCom ? {possivelDuplicidadeDe: dec.revisarCom, motivoRevisao: dec.motivo} : {})});
      oficinaId = criar.id;
    }
    tx.set(evRef, {userId: it.uid, oficinaId, criadoEm: F.serverTimestamp()});
    return alvo ? "atualizada" : "criada";
  });
}

// ---------- 5. Fila de segurança (se a nuvem falhar, tenta de novo depois; nunca bloqueia a entrega) ----------
let ofFila = Promise.resolve();                    // tudo passa por esta fila: um item por vez neste aparelho
const ofVistos = new Set();
const ofChave = uid => "basefila:" + uid;          // guardada na loja "cache" já existente do IndexedDB (sem mudar a estrutura do banco local)
const ofLerFila = async uid => { try { const c = await idb.get("cache", ofChave(uid)); return c ? JSON.parse(c.v) : []; } catch { return []; } };
const ofSalvarFila = async (uid, a) => { try { if (a.length) await idb.put("cache", {k: ofChave(uid), v: JSON.stringify(a)}); else await idb.del("cache", ofChave(uid)); } catch {} };
async function ofEnfileirar(it) {
  const f = await ofLerFila(it.uid); if (f.some(x => x.entregaId === it.entregaId)) return;
  f.push(it); await ofSalvarFila(it.uid, f.slice(-OF.MAX_FILA));
}
async function ofProcessarItem(it) {
  if (ofVistos.has(it.entregaId)) return "ja_contabilizada";
  if (!db || !auth?.currentUser || auth.currentUser.uid !== it.uid || !navigator.onLine) throw Object.assign(new Error("indisponível agora"), {rede: true});
  const cands = await comTempo(ofCandidatos(it), 15000, "Tempo esgotado ao consultar a base de oficinas.");
  const res = await comTempo(ofGravar(it, ofDecidir(it, cands)), 25000, "Tempo esgotado ao gravar na base de oficinas.");
  ofVistos.add(it.entregaId); return res;
}
function ofAlimentar(entregaId, snap, dados) {     // ponto de entrada: nunca lança e nunca é aguardado
  try {
    const it = ofItemDeEntrega(entregaId, snap, dados); if (!it) return;
    ofFila = ofFila.then(async () => {
      try { await ofProcessarItem(it); }
      catch (e) { if (e?.code === "invalid-argument") console.warn("Base de oficinas:", e.message); else await ofEnfileirar(it); }
    }).catch(() => {});
  } catch (e) { console.warn("Base de oficinas:", e); }
}
function ofDescarregar() {                         // reenvia o que ficou pendente (volta da conexão, reabertura do app, intervalo)
  ofFila = ofFila.then(async () => {
    const uid = auth?.currentUser?.uid; if (!uid || !db || !navigator.onLine) return;
    const fila = await ofLerFila(uid); if (!fila.length) return;
    const resto = [];
    for (let i = 0; i < fila.length; i++) {
      const it = fila[i];
      try { await ofProcessarItem(it); }
      catch (e) {
        if (e?.code !== "invalid-argument") { it.t = (it.t || 0) + 1; if (it.t < OF.MAX_TENT) resto.push(it); }
        if (ehRede(e)) { resto.push(...fila.slice(i + 1)); break; }
      }
    }
    await ofSalvarFila(uid, resto);
  }).catch(() => {});
}
addEventListener("online", () => setTimeout(ofDescarregar, 1500));
document.addEventListener("visibilitychange", () => { if (!document.hidden) ofDescarregar(); });
setTimeout(ofDescarregar, 20000); setInterval(ofDescarregar, 300000);
// OF-END

// ---------- 6. Painel administrativo: consulta e exportação (somente leitura) ----------
const ofData = v => { const d = paraData(v); return d ? d.toLocaleString("pt-BR") : "—"; };
const ofIso = v => { const d = paraData(v); return d ? d.toISOString() : null; };
async function ofAdmResumo() {
  exigirAdmin(); const g = admGen, col = F.collection(db, OF.COL);
  const [tot, novos, rev, ult] = await Promise.all([
    F.getCountFromServer(col),
    F.getCountFromServer(F.query(col, F.where("primeiroRegistro", ">=", new Date(Date.now() - OF.NOVOS_DIAS * 864e5)))),
    F.getCountFromServer(F.query(col, F.where("revisar", "==", true))),
    F.getDocs(F.query(col, F.orderBy("ultimaIdentificacao", "desc"), F.limit(1)))
  ]);
  if (g !== admGen) return null;
  return {total: tot.data().count, novos: novos.data().count, revisar: rev.data().count, ultima: ult.docs[0]?.data().ultimaIdentificacao || null};
}
async function ofAdmPagina(busca, cursor) {        // paginado; a busca é por início do nome (sem acento/maiúscula)
  exigirAdmin(); const g = admGen, col = F.collection(db, OF.COL), b = ofNormalizar(busca);
  const q = []; if (b) q.push(F.where("nomeNormalizado", ">=", b), F.where("nomeNormalizado", "<=", b + ""));
  q.push(F.orderBy("nomeNormalizado"), F.limit(OF.PAG)); if (cursor) q.push(F.startAfter(cursor));
  const sn = await F.getDocs(F.query(col, ...q)); if (g !== admGen) return null;
  return {itens: sn.docs.map(d => ({id: d.id, ...d.data()})), fim: sn.docs.length < OF.PAG, cursor: sn.docs.length ? sn.docs[sn.docs.length - 1] : cursor};
}
async function ofAdmTodos(aoProgresso) {           // lê tudo em lotes, apenas leitura
  exigirAdmin(); const g = admGen, col = F.collection(db, OF.COL), todos = []; let cursor = null;
  for (;;) {
    exigirAdmin();
    const q = [F.orderBy(F.documentId()), F.limit(OF.LOTE_EXPORT)]; if (cursor) q.push(F.startAfter(cursor));
    const sn = await F.getDocsFromServer(F.query(col, ...q));
    if (g !== admGen) throw new Error("Exportação cancelada: a sessão administrativa foi encerrada.");
    sn.docs.forEach(d => todos.push({id: d.id, ...d.data()})); aoProgresso?.(todos.length);
    if (sn.docs.length < OF.LOTE_EXPORT) break; cursor = sn.docs[sn.docs.length - 1];
  }
  return todos;
}
const ofLinhaJson = o => ({id: o.id, nome: o.nome, nome_normalizado: o.nomeNormalizado, latitude: o.latitude, longitude: o.longitude,
  primeiro_registro: ofIso(o.primeiroRegistro), ultima_identificacao: ofIso(o.ultimaIdentificacao), ocorrencias: o.ocorrencias ?? 0,
  origem: o.origem || "entrega_facil", precisao_m: o.precisaoM ?? null, revisar: !!o.revisar, possivel_duplicidade_de: o.possivelDuplicidadeDe || null,
  motivo_revisao: o.motivoRevisao || null, variacoes_nome: o.variacoesNome || []});
function ofMontarJson(todos, agora) {
  return JSON.stringify({tipo: "base_oficinas", versao: "1.0", data_exportacao: agora.toISOString(), total_estabelecimentos: todos.length, estabelecimentos: todos.map(ofLinhaJson)}, null, 2);
}
const ofCsvTxt = s => { let t = String(s ?? ""); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };   // aspas duplicadas + proteção contra fórmulas do Excel
function ofMontarCsv(todos) {
  const L = ["ID;NOME;LATITUDE;LONGITUDE;PRIMEIRO REGISTRO;ÚLTIMA IDENTIFICAÇÃO;OCORRÊNCIAS;NOME NORMALIZADO;REVISAR"];
  todos.forEach(o => L.push([ofCsvTxt(o.id), ofCsvTxt(o.nome), String(o.latitude), String(o.longitude), ofCsvTxt(ofIso(o.primeiroRegistro) || ""), ofCsvTxt(ofIso(o.ultimaIdentificacao) || ""),
    String(o.ocorrencias ?? 0), ofCsvTxt(o.nomeNormalizado), o.revisar ? "SIM" : "NÃO"].join(";")));
  return "﻿" + L.join("\r\n") + "\r\n";   // BOM: o Excel reconhece UTF-8 (acentos); ";" é o separador do Excel em português
}
function baixarArquivo(nome, texto, tipo) {
  const u = URL.createObjectURL(new Blob([texto], {type: tipo})), a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function ofExportar(formato, botoes, status) {
  botoes.forEach(b => b.disabled = true);
  try {
    status.textContent = "Lendo a base…";
    const todos = await ofAdmTodos(n => { status.textContent = `Lendo a base… ${n} estabelecimento(s)`; });
    const agora = new Date(), nome = `base_oficinas_entrega_facil_${isoData(agora)}.${formato}`;
    if (formato === "json") baixarArquivo(nome, ofMontarJson(todos, agora), "application/json;charset=utf-8");
    else baixarArquivo(nome, ofMontarCsv(todos), "text/csv;charset=utf-8");
    status.textContent = "";
    toast(todos.length ? `Download concluído: ${nome} (${todos.length} estabelecimento(s)). Os dados continuam no Firebase.` : `A base ainda está vazia. Foi gerado ${nome} apenas com a estrutura.`, todos.length ? "ok" : "warn");
  } catch (e) { status.textContent = ""; toast("Não foi possível exportar: " + msgErro(e), "err"); }
  finally { botoes.forEach(b => b.disabled = false); }
}
function ofCartao(o) {
  const mot = {mesmo_nome_distante: "mesmo nome em local um pouco distante", nome_semelhante: "nome parecido por perto", mesmo_ponto_nome_diferente: "outro nome no mesmo ponto"}[o.motivoRevisao] || "";
  return `<div class="box"><b>${esc(o.nome)}</b>${o.revisar ? ' <span class="selo">REVISAR</span>' : ""}
    <dl><dt>Latitude / Longitude</dt><dd>${esc(o.latitude)}, ${esc(o.longitude)}</dd><dt>Primeiro registro</dt><dd>${esc(ofData(o.primeiroRegistro))}</dd>
    <dt>Última identificação</dt><dd>${esc(ofData(o.ultimaIdentificacao))}</dd><dt>Ocorrências</dt><dd>${esc(o.ocorrencias ?? 0)}</dd></dl>
    ${o.revisar ? `<p class="mut peq">Possível duplicidade${mot ? " (" + esc(mot) + ")" : ""} — registro mantido separado, sem fusão automática.</p>` : ""}</div>`;
}
// Importação das entregas JÁ existentes (somente admin). Só LÊ "deliveries"; grava apenas na base de oficinas. Usa o mesmo caminho das entregas novas
// (mesmas regras de elegibilidade, decisão e transação) e o marcador por entrega: pode ser repetida ou retomada sem contar nada duas vezes.
async function ofImportarAntigas(aoLer, aoImportar, cancelado) {
  exigirAdmin(); const g = admGen, uid = auth.currentUser.uid, r = {lidas: 0, elegiveis: 0, semNome: 0, outras: 0, criadas: 0, atualizadas: 0, jaContadas: 0, falhas: 0, parou: false, rede: false, negado: false}, itens = [];
  let cursor = null;
  for (;;) {
    exigirAdmin();
    const q = [F.orderBy(F.documentId()), F.limit(OF.LOTE_EXPORT)]; if (cursor) q.push(F.startAfter(cursor));
    const sn = await F.getDocsFromServer(F.query(F.collection(db, "deliveries"), ...q));
    if (g !== admGen || cancelado()) { r.parou = true; return r; }
    sn.docs.forEach(x => {
      const d = x.data(); r.lidas++;
      const it = ofItemDeEntrega(x.id, {uid}, d);   // uid = o administrador (é quem grava o marcador, como as regras exigem)
      if (it) { it.ordem = (d.deliveryDate || "") + (d.deliveryTime || ""); itens.push(it); }
      else if (d.locationKind === "entrega" && ofNomeDaEntrega(d.deliveryName) === null) r.semNome++; else r.outras++;
    });
    aoLer(r.lidas);
    if (sn.docs.length < OF.LOTE_EXPORT) break; cursor = sn.docs[sn.docs.length - 1];
  }
  itens.sort((a, b) => a.ordem.localeCompare(b.ordem)); r.elegiveis = itens.length;   // do mais antigo ao mais novo: o 1º nome/GPS de cada oficina é o mais antigo
  for (let i = 0; i < itens.length; i++) {
    if (g !== admGen || cancelado()) { r.parou = true; break; }
    try { const x = await ofProcessarItem(itens[i]); if (x === "criada") r.criadas++; else if (x === "atualizada") r.atualizadas++; else r.jaContadas++; }
    catch (e) { if (ehRede(e)) { r.rede = true; break; } if (e?.code === "permission-denied") { r.negado = true; break; } r.falhas++; }
    aoImportar(i + 1, itens.length);
  }
  return r;
}
// Tela "Base de oficinas" dentro do painel administrativo. base/falha/voltar vêm de abrirPainel (mesmo padrão das outras telas do painel).
async function baseOficinas(root, base, falha, voltar) {
  const tela = html => { base(html); painelVoltar = voltar; };
  tela('<p class="vazio">Carregando base de oficinas…</p>');
  let r; try { r = await ofAdmResumo(); if (!r) return; } catch (e) { falha(e, () => baseOficinas(root, base, falha, voltar)); return; }
  tela(`<button class="btn" id="o-voltar">‹ Funcionários</button><h2>Base inteligente de oficinas</h2>
    <p class="mut peq">Estabelecimentos únicos identificados automaticamente pelas entregas salvas no Entrega Fácil. Exportar é apenas leitura: nada é apagado ou alterado.</p>
    <div class="kpis"><div class="kpi"><b>${r.total.toLocaleString("pt-BR")}</b>Estabelecimentos cadastrados</div><div class="kpi"><b>${r.novos.toLocaleString("pt-BR")}</b>Novos nos últimos ${OF.NOVOS_DIAS} dias</div>
    <div class="kpi"><b>${r.revisar.toLocaleString("pt-BR")}</b>Possíveis duplicidades</div><div class="kpi"><b style="font-size:16px">${esc(ofData(r.ultima))}</b>Última atualização</div></div>
    <button class="btn pri" id="o-ver">🔎 Visualizar oficinas</button>
    <div class="row"><button class="btn vd" id="o-json">⬇ Baixar base (JSON)</button><button class="btn" id="o-csv">⬇ Baixar base (CSV)</button></div>
    <p class="mut peq" id="o-st"></p>
    <div class="box"><b>Importar entregas já registradas</b><br><span class="mut peq">Lê as entregas antigas de todos os funcionários e coloca na base os estabelecimentos com nome e GPS válidos. Não altera as entregas. Pode rodar mais de uma vez ou parar e continuar depois: nada é contado duas vezes. Mantenha esta tela aberta até terminar.</span>
    <button class="btn pri" id="o-imp">▶ Importar entregas antigas</button><button class="btn red" id="o-imp-x" hidden>■ Parar</button><p class="mut peq" id="o-imp-st"></p></div><div id="o-area"></div>`);
  root.onclick = null;
  root.querySelector("#o-voltar").onclick = voltar;
  const bt = [root.querySelector("#o-json"), root.querySelector("#o-csv")], st = root.querySelector("#o-st");
  bt[0].onclick = () => ofExportar("json", bt, st); bt[1].onclick = () => ofExportar("csv", bt, st);
  const imp = root.querySelector("#o-imp"), pare = root.querySelector("#o-imp-x"), ist = root.querySelector("#o-imp-st"); let cancela = false;
  pare.onclick = () => { cancela = true; pare.disabled = true; ist.textContent = "Parando…"; };
  imp.onclick = async () => {
    cancela = false; imp.disabled = true; pare.hidden = false; pare.disabled = false; bt.forEach(b => b.disabled = true); ist.textContent = "Lendo entregas…";
    try {
      const x = await ofImportarAntigas(n => { ist.textContent = `Lendo entregas… ${n}`; }, (i, n) => { ist.textContent = `Importando… ${i} de ${n}`; }, () => cancela);
      ist.textContent = `${x.lidas} entrega(s) lidas; ${x.elegiveis} com nome e GPS válidos → ${x.criadas} estabelecimento(s) novo(s), ${x.atualizadas} ocorrência(s) somada(s), ${x.jaContadas} já contada(s) antes. Ignoradas: ${x.semNome} sem nome de estabelecimento (ex.: "Entrega 3"), ${x.outras} sem GPS válido, imprecisas ou especiais.`
        + (x.falhas ? ` ${x.falhas} falha(s) isolada(s): rode de novo.` : "")
        + (x.parou ? " Importação interrompida: toque em Importar para continuar de onde parou." : "")
        + (x.rede ? " A conexão caiu: toque em Importar para continuar." : "")
        + (x.negado ? " O servidor negou a gravação: publique o firestore.rules atualizado e tente de novo." : "");
      const rr = await ofAdmResumo(); if (rr) { const k = root.querySelectorAll(".kpis .kpi b"); if (k.length === 4) { k[0].textContent = rr.total.toLocaleString("pt-BR"); k[1].textContent = rr.novos.toLocaleString("pt-BR"); k[2].textContent = rr.revisar.toLocaleString("pt-BR"); k[3].textContent = ofData(rr.ultima); } }
    } catch (e) { ist.textContent = "Não foi possível importar: " + msgErro(e); }
    finally { imp.disabled = false; pare.hidden = true; bt.forEach(b => b.disabled = false); }
  };
  root.querySelector("#o-ver").onclick = () => {
    const area = root.querySelector("#o-area"); root.querySelector("#o-ver").hidden = true;
    area.innerHTML = `<label>Buscar pelo início do nome<input id="o-q" type="search" autocomplete="off"></label><div id="o-lst"></div>`;
    let busca = "", cursor = null, tmp = null, seq = 0;
    const lst = area.querySelector("#o-lst");
    const carregar = async mais => {
      const meu = ++seq; if (!mais) { cursor = null; lst.innerHTML = '<p class="vazio">Carregando…</p>'; }
      try {
        const p = await ofAdmPagina(busca, mais ? cursor : null); if (!p || meu !== seq) return; cursor = p.cursor;
        const velho = lst.querySelector("#o-mais"); if (velho) velho.remove();
        if (!mais) lst.innerHTML = "";
        lst.insertAdjacentHTML("beforeend", p.itens.map(ofCartao).join("") || (mais ? "" : '<p class="vazio">Nenhum estabelecimento encontrado.</p>'));
        if (!p.fim) { lst.insertAdjacentHTML("beforeend", '<button class="btn" id="o-mais">Carregar mais</button>'); lst.querySelector("#o-mais").onclick = () => carregar(true); }
      } catch (e) { if (meu === seq) lst.innerHTML = `<p class="err">${esc(msgErro(e))}</p>`; }
    };
    area.querySelector("#o-q").oninput = e => { clearTimeout(tmp); busca = e.target.value; tmp = setTimeout(() => carregar(false), 350); };
    carregar(false);
  };
}

// ===================== 9. INICIALIZAÇÃO GERAL =====================
function limparSessaoVisual() {                   // impede reaproveitar visualmente dados da conta anterior
  perfil = null; lista = []; visao = "agenda"; pilhaTabs = ["agenda"]; painelVoltar = null; bloquearAdminLocal(); admSessao = false; fotos.clear(); fecharModal();
  document.querySelectorAll(".view").forEach(v => v.innerHTML = ""); $("#quem").textContent = "";
}
const erroAuth = m => { $("#a-err").textContent = m || ""; };
async function bootstrap() {
  $("#a-status").textContent = "Conectando ao Firebase…";
  try { await iniciarFirebase(); }
  catch (e) { $("#a-status").textContent = ""; erroAuth(e.message || msgErro(e)); return; }   // login continua visível
  $("#a-status").textContent = "";
  aoMudarSessao(async u => {
    if (registrando) return;
    if (!u) { limparSessaoVisual(); mostrar("auth"); return; }
    try { await iniciar(u); }
    catch (e) { mostrar("auth"); erroAuth("Você está autenticado, mas não foi possível carregar seus dados (" + msgErro(e) + "). Verifique a conexão e as regras do Firestore e tente novamente."); }
  });
}
// ===================== BOTÃO VOLTAR DO CELULAR =====================
// O histórico do navegador mantém sempre uma entrada "base" e uma "armadilha" à frente. Ao tocar em voltar, o navegador cai na base;
// o app decide o que "voltar" significa (fechar janela, subir um nível, confirmar a saída) e recoloca a armadilha.
let semArmadilha = false, pilhaTabs = ["agenda"], painelVoltar = null;
function armarVoltar() {
  if (history.state?.trap) return;                 // página recarregada: já estamos na armadilha
  history.replaceState({base: true}, ""); history.pushState({trap: true}, "");
}
function voltarApp() {
  if (!$("#modal").hidden) { const f = modalAoVoltar; fecharModal(); if (f) f(); return; }          // 1) janela aberta: fecha/cancela
  if (!$("#app").hidden) {
    if (visao === "cfg" && painelVoltar) { painelVoltar(); return; }                                // 2) dentro do painel admin: sobe um nível
    if (pilhaTabs.length > 1) { pilhaTabs.pop(); irPara(pilhaTabs[pilhaTabs.length - 1], true); return; }   // 3) telas visitadas, de trás para frente
    confirmarSaida(); return;                                                                       // 4) página principal: pergunta antes de sair
  }
  if (!$("#a-home").hidden) { sairDoApp(true); return; }                                            // login: tela inicial → novo voltar sai
  $("#a-home").hidden = false; fs.cad.hidden = true; fs.log.hidden = true;                          // login: fecha o formulário
}
async function confirmarSaida() { if (await confirmar("Deseja sair do aplicativo?", "Sair")) sairDoApp(true); }
function sairDoApp(avisar) {                       // o navegador não deixa o site se fechar sozinho: vai para a entrada base; um novo "voltar" sai
  semArmadilha = true; history.go(-1);
  setTimeout(() => { try { window.close(); } catch {} }, 300);
  if (avisar) toast("Toque em voltar mais uma vez para fechar o aplicativo.", "warn");
  setTimeout(() => { if (semArmadilha) { semArmadilha = false; history.pushState({trap: true}, ""); } }, 5000);   // continuou no app: rearma
}
addEventListener("popstate", () => { if (semArmadilha) return; history.pushState({trap: true}, ""); voltarApp(); });

armarVoltar();
bootstrap();
