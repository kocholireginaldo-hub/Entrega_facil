<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
[hidden]{display:none!important}
h1,h2{margin:.2em 0}.mut{color:var(--mut)}.peq{font-size:13px}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);margin-top:4px}

</style></head><body>

<script>
/* Rede de segurança: mostra erros do aplicativo em vez de deixar a tela branca. */
function avisar(m){var a=document.getElementById("aviso");if(a){a.textContent=m;a.hidden=false;}}
addEventListener("error",function(e){avisar("Erro no aplicativo: "+(e.message||"falha ao carregar"));});
addEventListener("unhandledrejection",function(e){var r=e.reason;avisar("Falha: "+((r&&r.message)||"erro inesperado"));});
/* Service worker opcional: qualquer falha aqui não afeta o app. */
if("serviceWorker" in navigator)addEventListener("load",function(){try{navigator.serviceWorker.register("service-worker.js",{scope:"./"}).then(function(r){r.update();}).catch(function(){});}catch(e){}});
</script>
<script type="module">
"use strict";

// ===================== 1. UTILIDADES DE INTERFACE =====================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2 = n => String(n).padStart(2, "0");
const isoData = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const horaHM = d => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
const fmtData = iso => (iso || "").split("-").reverse().join("/");
const fmtCriado = d => d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString("pt-BR") : "—";
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let tt;
function toast(m, tipo = "ok") { const t = $("#toast"); t.textContent = m; t.className = "show " + tipo; clearTimeout(tt); tt = setTimeout(() => t.className = "", 5500); }
function abrirModal(html) { const m = $("#modal"); m.innerHTML = `<div class="sheet">${html}</div>`; m.hidden = false; return m.firstChild; }
function fecharModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
function confirmar(msg, botao) {
  return new Promise(res => {
    const s = abrirModal(`<p>${esc(msg)}</p><div class="row"><button class="btn" data-r="0">Cancelar</button><button class="btn red" data-r="1">${esc(botao)}</button></div>`);
    s.onclick = e => { const b = e.target.closest("[data-r]"); if (b) { fecharModal(); res(b.dataset.r === "1"); } };
  });
}

// ===================== 2. FIREBASE (Authentication + Cloud Firestore; sem Storage) =====================
// >>> PREENCHA com os valores do SEU projeto (copie do seu firebase-config.js antigo ou do console do Firebase) <<<
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCujnKuwlllYnIur-x4YM93cj67p0lQLNQ",
  authDomain: "entrega-facil-2-1a43c.firebaseapp.com",
  projectId: "entrega-facil-2-1a43c",
  storageBucket: "entrega-facil-2-1a43c.firebasestorage.app", // não usado pelo app
  messagingSenderId: "265187382073",
  appId: "1:265187382073:web:9854f2a01be513bf344ee8"
};
// Senha do painel Administrador. O app confere a senha e a envia ao Firebase, e as regras (firestore.rules) conferem a MESMA senha no servidor.
// Se mudar aqui, mude também em firestore.rules. Quem inspecionar este código descobre a senha: use uma senha mais longa se os dados forem sensíveis.
const ADMIN_PIN = "3030";

let auth = null, db = null, A = null, F = null;   // A = módulo auth, F = módulo firestore
const configOk = () => ["apiKey", "authDomain", "projectId", "appId"].every(k => FIREBASE_CONFIG[k] && !String(FIREBASE_CONFIG[k]).includes("COLE_AQUI"));
async function iniciarFirebase() {   // carregado dinamicamente: se a CDN falhar, a tela de login continua visível
  if (!configOk()) throw new Error("O Firebase ainda não foi configurado: preencha FIREBASE_CONFIG no início do script do index.html.");
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [appM, authM, fsM] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  A = authM; F = fsM; auth = A.getAuth(app); db = F.getFirestore(app);
}
const exigir = () => { if (!auth || !db) throw new Error("Firebase indisponível. Verifique a configuração e a conexão e recarregue a página."); };
const comTempo = (p, ms, msg) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(msg)), ms))]);

// ===================== 3. AUTENTICAÇÃO =====================
const ERROS = {
  "auth/invalid-email": "E-mail inválido.", "auth/email-already-in-use": "Este e-mail já está cadastrado.",
  "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.", "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/wrong-password": "E-mail ou senha incorretos.", "auth/user-not-found": "E-mail ou senha incorretos.",
  "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo.", "auth/network-request-failed": "Sem conexão com a internet.",
  "auth/operation-not-allowed": "Login por e-mail/senha não está ativado no Firebase (Authentication > Método de login).",
  "auth/unauthorized-domain": "Este endereço não está em Authentication > Configurações > Domínios autorizados.",
  "permission-denied": "Sem permissão no banco (verifique as regras do Firestore).", "unavailable": "Banco de dados indisponível no momento."
};
const msgErro = e => ERROS[e?.code] || e?.message || "Ocorreu um erro inesperado.";

async function cadastrar(nome, email, senha, empresa) {
  exigir();
  const c = await A.createUserWithEmailAndPassword(auth, email, senha);
  const perfil = {uid: c.user.uid, nome, email, empresa, role: "employee", createdAt: F.serverTimestamp()};
  try { await F.setDoc(F.doc(db, "users", c.user.uid), perfil); }
  catch (e) { await c.user.delete().catch(() => {}); throw new Error("Não foi possível salvar o perfil (" + msgErro(e) + "). O cadastro NÃO foi concluído; tente novamente."); }
  return perfil;
}
const entrar = (email, senha) => { exigir(); return A.signInWithEmailAndPassword(auth, email, senha); };
const sair = () => { exigir(); return A.signOut(auth); };
const recuperarSenha = email => { exigir(); return A.sendPasswordResetEmail(auth, email); };
const aoMudarSessao = cb => A.onAuthStateChanged(auth, cb);
async function carregarPerfil(uid) { const s = await F.getDoc(F.doc(db, "users", uid)); return s.exists() ? s.data() : null; }

// ===================== 4. FIRESTORE =====================
const colEntregas = () => F.collection(db, "deliveries");
const mapear = s => s.docs.map(d => ({id: d.id, ...d.data()}));
const listarMinhas = async uid => mapear(await F.getDocs(F.query(colEntregas(), F.where("userId", "==", uid))));

// ----- Administração sob demanda -----
// Nada abaixo roda no login, no cadastro, nos Ajustes nem nas telas comuns: só depois de autorizarAdmin().
const ADM_MIN = 60, ADM_PAG = 300;                 // validade da autorização (igual às regras) e tamanho da página
let admAte = 0, admGen = 0, admSessao = false, admUsuarios = null;
const admDados = new Map(), admContagens = new Map();
const adminAtivo = () => Date.now() < admAte;
const exigirAdmin = () => { if (!adminAtivo()) throw new Error("Sessão administrativa expirada ou bloqueada. Entre novamente pelos Ajustes."); };
// ÚNICA porta de entrada: confere a senha e pede ao servidor a autorização (documento adminSessions/{uid}, validado pelas regras).
async function autorizarAdmin(pin) {
  if (!pin || pin !== ADMIN_PIN) throw new Error("Senha incorreta.");
  exigir();
  try { await F.setDoc(F.doc(db, "adminSessions", auth.currentUser.uid), {pin: ADMIN_PIN, criadoEm: F.serverTimestamp()}); }
  catch (e) { throw new Error(e?.code === "permission-denied" ? "O servidor não autorizou o acesso administrativo. Publique o firestore.rules atualizado e confira se a senha nas regras é igual à do app." : msgErro(e)); }
  admSessao = true; admAte = Date.now() + (ADM_MIN - 1) * 60000;
}
function bloquearAdminLocal() {                    // bloqueia, cancela consultas em andamento e limpa a memória
  admGen++; admAte = 0; admUsuarios = null; admDados.clear(); admContagens.clear();
  fotosAdm.forEach(id => fotos.delete(id)); fotosAdm.clear();
}
async function encerrarAdmin() {                   // bloqueia também no servidor (apaga a sessão); não mexe nos dados
  const tinha = admSessao; admSessao = false; bloquearAdminLocal();
  if (tinha && auth?.currentUser) { try { await F.deleteDoc(F.doc(db, "adminSessions", auth.currentUser.uid)); } catch {} }
}
async function admCarregarUsuarios(forcar) {
  exigirAdmin(); const g = admGen;
  if (admUsuarios && !forcar) return admUsuarios;
  const r = (await F.getDocs(F.collection(db, "users"))).docs.map(d => d.data());
  if (g !== admGen) return null; return admUsuarios = r;
}
async function admContar(uid) {                    // contagem no servidor: não baixa as entregas
  exigirAdmin(); const g = admGen;
  if (admContagens.has(uid)) return admContagens.get(uid);
  const n = (await F.getCountFromServer(F.query(colEntregas(), F.where("userId", "==", uid)))).data().count;
  if (g !== admGen) return null; admContagens.set(uid, n); return n;
}
async function admCarregarEntregas(uid, mais) {    // entregas de UM funcionário, em páginas; reaproveita o que já foi carregado
  exigirAdmin(); const g = admGen; let e = admDados.get(uid);
  if (e && !mais) return e;
  e = e || {lista: [], fim: false, cursor: null};
  const q = [F.where("userId", "==", uid), F.orderBy(F.documentId()), F.limit(ADM_PAG)]; if (e.cursor) q.push(F.startAfter(e.cursor));
  const sn = await F.getDocs(F.query(colEntregas(), ...q));
  if (g !== admGen) return null;
  e.lista.push(...mapear(sn)); e.fim = sn.docs.length < ADM_PAG; e.cursor = sn.docs.length ? sn.docs[sn.docs.length - 1] : e.cursor;
  admDados.set(uid, e); return e;
}

// Sem Storage: a foto (JPEG reduzido, em texto base64) fica em /photos/{idDaEntrega}, separada da entrega para não pesar nas listas.
const MAX_FOTO = 350000, fotos = new Map();
const fotosAdm = new Set();
function fotoDe(id) {
  if (adminAtivo()) fotosAdm.add(id);
  if (!fotos.has(id)) fotos.set(id, F.getDoc(F.doc(db, "photos", id)).then(s => { if (!s.exists()) throw new Error("sem foto"); return s.data().photoData; }).catch(e => { fotos.delete(id); throw e; }));
  return fotos.get(id);
}
const blobFoto = async id => (await fetch(await fotoDe(id))).blob();
async function fotoParaDataUrl(file) {
  if (!file?.type?.startsWith("image/")) throw new Error("Escolha um arquivo de imagem.");
  if (file.size > 25e6) throw new Error("Imagem muito grande (máximo 25 MB).");
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch { img = await new Promise((ok, er) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => er(new Error("Não foi possível ler a imagem.")); i.src = URL.createObjectURL(file); }); }
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
  for (const [max, q] of [[1000, .65], [900, .55], [800, .45], [640, .4]]) {
    const k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL("image/jpeg", q);
    if (url.length <= MAX_FOTO) return url;
  }
  throw new Error("Não foi possível reduzir a foto o suficiente. Tente outra imagem.");
}
// Entrega + foto são gravadas juntas (lote atômico): ou ficam as duas, ou nenhuma.
async function salvarEntrega(perfil, dados, arquivo) {
  exigir();
  const photoData = await fotoParaDataUrl(arquivo), r = F.doc(colEntregas()), b = F.writeBatch(db);
  b.set(r, {userId: perfil.uid, employeeNameSnapshot: perfil.nome, employeeEmailSnapshot: perfil.email, companySnapshot: perfil.empresa,
    ...dados, hasPhoto: true, photoContentType: "image/jpeg", createdAt: F.serverTimestamp()});
  b.set(F.doc(db, "photos", r.id), {userId: perfil.uid, photoData, createdAt: F.serverTimestamp()});
  await comTempo(b.commit(), 30000, "Tempo esgotado: a entrega NÃO foi confirmada na nuvem. Confira a agenda antes de repetir, para não duplicar.");
  fotos.set(r.id, Promise.resolve(photoData));
  return r.id;
}
async function excluirEntrega(d) {
  exigir(); const b = F.writeBatch(db);
  b.delete(F.doc(db, "deliveries", d.id)); b.delete(F.doc(db, "photos", d.id));
  await comTempo(b.commit(), 30000, "Tempo esgotado: a exclusão NÃO foi confirmada.");
  fotos.delete(d.id); return {};
}

// ===================== 5. COMPARTILHAMENTO =====================

const coordOk = d => Number.isFinite(d.latitude) && Number.isFinite(d.longitude) && Math.abs(d.latitude) <= 90 && Math.abs(d.longitude) <= 180;
const linkMapa = d => coordOk(d) ? `https://www.google.com/maps?q=${d.latitude},${d.longitude}` : null;

function textoEntrega(d, cabecalho = true) {
  const e = d.deliveryType === "special", L = [];
  if (cabecalho) L.push("COMPROVANTE DE ENTREGA", "");
  if (e) L.push("*ENTREGA ESPECIAL — REGISTRO RETROATIVO*");
  L.push(`Entrega: ${d.deliveryName}`, `Tipo: ${e ? "Entrega Especial" : "Entrega Padrão"}`, `Entregador: ${d.employeeNameSnapshot}`, `Empresa: ${d.companySnapshot}`,
    `Data${e ? " informada" : ""}: ${fmtData(d.deliveryDate)}`, `Horário${e ? " informado" : ""}: ${d.deliveryTime}`);
  if (e) L.push(`Registro criado em: ${fmtCriado(d)}`);
  if (d.notes) L.push(`Obs.: ${d.notes}`);
  if (coordOk(d)) L.push(`${e ? "Localização no momento do registro" : "Localização"}: ${d.latitude}, ${d.longitude}${d.accuracyMeters ? ` (precisão ~${d.accuracyMeters} m)` : ""}`, `Google Maps: ${linkMapa(d)}`);
  else L.push("Localização: não registrada");
  return L.join("\n");
}

async function enviar(texto, docs) {
  const files = [];
  for (const d of docs) { try { files.push(new File([await blobFoto(d.id)], `entrega-${d.id}.jpg`, {type: "image/jpeg"})); } catch {} }
  try {
    if (files.length && navigator.canShare?.({files})) { await navigator.share({text: texto, files}); return; }
    if (navigator.share) {
      if (docs.length) toast("Este aparelho/navegador não envia foto junto com o texto. Compartilhando só o texto.", "warn");
      await navigator.share({text: texto}); return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(texto); } catch {}
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
  toast("Texto copiado e WhatsApp aberto. Anexe a(s) foto(s) manualmente pela galeria.", "warn");
}
const compartilharEntrega = d => enviar(textoEntrega(d), [d]);
function compartilharDia(lista, data, nome) {
  const cab = `RELATÓRIO DE ENTREGAS — ${fmtData(data)}\nEntregador: ${nome}\nTotal: ${lista.length}\n`;
  const corpo = lista.map((d, i) => `\n--- ${i + 1} ---\n${textoEntrega(d, false)}`).join("\n");
  return enviar(cab + corpo, lista);
}

// ===================== 6. AGENDA, DETALHES, RESUMO =====================

const ordenar = (a, b) => (b.deliveryDate + b.deliveryTime).localeCompare(a.deliveryDate + a.deliveryTime);
const porHora = (a, b) => (a.deliveryDate + a.deliveryTime).localeCompare(b.deliveryDate + b.deliveryTime);

function cartao(d) {

  ${e ? `<span class="selo">ENTREGA ESPECIAL — REGISTRO RETROATIVO</span><br><span class="mut peq">Registrado em ${esc(fmtCriado(d))}</span>` : '<span class="tag">Entrega Padrão</span>'}
  ${d.employeeNameSnapshot ? `<br><span class="mut peq">${esc(d.employeeNameSnapshot)}</span>` : ""}</div>
  <div class="acts"><button data-a="ver">Detalhes</button><button data-a="sh">📤 Compartilhar</button><button data-a="del" class="x" aria-label="Excluir">🗑</button></div></article>`;

function miniaturas(root) {
  root.querySelectorAll("img[data-i]").forEach(async i => { try { i.src = await fotoDe(i.dataset.i); } catch { i.alt = "sem foto"; } });
}

async function excluir(d, lista, depois) {
  if (!await confirmar("Deseja realmente excluir esta entrega? Essa ação não poderá ser desfeita.", "Excluir entrega")) return;
  try {
    const r = await excluirEntrega(d);

    toast(r.fotoPendente ? "Entrega excluída, mas a fotografia não pôde ser removida agora. Será tentado de novo no próximo acesso." : "Entrega excluída.", r.fotoPendente ? "warn" : "ok");
  } catch (e) { toast("Não foi possível excluir: " + msgErro(e), "err"); }

}

function detalhes(d, lista, depois) {
  const e = d.deliveryType === "special", reg = d.locationKind === "registro", mapa = linkMapa(d);
  const s = abrirModal(`${e ? '<span class="selo">ENTREGA ESPECIAL — REGISTRO RETROATIVO</span>' : '<span class="tag">Entrega Padrão</span>'}
  <h2>${esc(d.deliveryName)}</h2><img class="foto" data-i="${esc(d.id)}" alt="Fotografia da entrega">
  <dl><dt>Entregador</dt><dd>${esc(d.employeeNameSnapshot)}</dd><dt>Empresa</dt><dd>${esc(d.companySnapshot)}</dd>

  ${d.notes ? `<dt>Observações</dt><dd>${esc(d.notes)}</dd>` : ""}

  <dd>${coordOk(d) ? `${d.latitude}, ${d.longitude}${d.accuracyMeters ? ` (precisão ~${d.accuracyMeters} m)` : ""}` : "Não registrada"}</dd></dl>
  ${reg ? '<p class="aviso">Esta localização corresponde ao momento em que o registro foi criado e não comprova o local da entrega ocorrida antes.</p>' : ""}

  <button class="btn vd" data-a="sh">📤 Compartilhar comprovante</button><button class="btn red" data-a="del">🗑 Excluir entrega</button><button class="btn" data-a="fx">Fechar</button>`);

// Trata cliques nos cartões; devolve true se tratou
function acaoCartao(ev, lista, depois) {
  const b = ev.target.closest("[data-a]"), c = ev.target.closest(".card");
  if (!b || !c) return false;
  const d = lista.find(x => x.id === c.dataset.id); if (!d) return true;
  if (b.dataset.a === "ver") detalhes(d, lista, depois); else if (b.dataset.a === "sh") compartilharEntrega(d); else if (b.dataset.a === "del") excluir(d, lista, depois);
  return true;
}

function montarAgenda(root, lista, o = {}) {
  const hj = new Date(), st = {y: hj.getFullYear(), m: hj.getMonth(), sel: isoData(hj)};
  const draw = () => {
    const cont = {}; lista.forEach(d => cont[d.deliveryDate] = (cont[d.deliveryDate] || 0) + 1);
    const prim = new Date(st.y, st.m, 1).getDay(), n = new Date(st.y, st.m + 1, 0).getDate(); let cel = "";
    for (let i = 0; i < prim; i++) cel += "<i></i>";
    for (let i = 1; i <= n; i++) { const iso = `${st.y}-${p2(st.m + 1)}-${p2(i)}`;
      cel += `<button class="dia${iso === isoData(hj) ? " hoje" : ""}${iso === st.sel ? " sel" : ""}" data-dia="${iso}">${i}${cont[iso] ? `<em>${cont[iso]}</em>` : ""}</button>`; }
    const doDia = lista.filter(d => d.deliveryDate === st.sel).sort(porHora);
    root.innerHTML = `<div class="cal"><div class="calh"><button data-mes="-1" aria-label="Mês anterior">‹</button><b>${MESES[st.m]} ${st.y}</b><button data-mes="1" aria-label="Próximo mês">›</button></div>
    <div class="sem">${[..."DSTQQSS"].map(x => `<span>${x}</span>`).join("")}</div><div class="grade">${cel}</div></div>
    <p class="resdia"><b>${fmtData(st.sel)}</b> — ${doDia.length} entrega(s)</p>
    <div class="row">${o.onNova ? '<button class="btn pri" data-nova>＋ Nova entrega</button>' : ""}${doDia.length ? '<button class="btn vd" data-rel>📤 Relatório do dia</button>' : ""}</div>
    ${doDia.map(cartao).join("") || '<p class="vazio">Nenhuma entrega neste dia.</p>'}`;
    miniaturas(root);
  };
  root.onclick = ev => {
    if (acaoCartao(ev, lista, draw)) return;
    const t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.mes) { st.m += +t.dataset.mes; if (st.m < 0) { st.m = 11; st.y--; } if (st.m > 11) { st.m = 0; st.y++; } draw(); }
    else if (t.dataset.dia) { st.sel = t.dataset.dia; draw(); }
    else if ("nova" in t.dataset) o.onNova(st.sel);
    else if ("rel" in t.dataset) { const l = lista.filter(d => d.deliveryDate === st.sel).sort(porHora); compartilharDia(l, st.sel, l[0].employeeNameSnapshot); }
  };
  draw(); return draw;
}

function montarResumo(root, lista) {
  const hj = new Date(); let dia = isoData(hj), mes = dia.slice(0, 7);
  const draw = () => {
    const noMes = lista.filter(d => d.deliveryDate.startsWith(mes)), noDia = lista.filter(d => d.deliveryDate === dia);
    const [y, m] = mes.split("-").map(Number), n = new Date(y, m, 0).getDate(), dec = (y === hj.getFullYear() && m === hj.getMonth() + 1) ? hj.getDate() : n;
    const por = Array.from({length: n}, (_, i) => noMes.filter(d => d.deliveryDate === `${mes}-${p2(i + 1)}`).length), max = Math.max(1, ...por);
    root.innerHTML = `<h2>Resumo</h2><label>Dia<input type="date" id="r-d" value="${dia}"></label><label>Mês<input type="month" id="r-m" value="${mes}"></label>
    <div class="kpis"><div class="kpi"><b>${noDia.length}</b>Entregas no dia</div><div class="kpi"><b>${noMes.length}</b>Entregas no mês</div>
    <div class="kpi"><b>${noDia.filter(d => d.deliveryType === "standard").length}</b>Padrão (dia)</div><div class="kpi"><b>${noDia.filter(d => d.deliveryType === "special").length}</b>Especiais (dia)</div>
    <div class="kpi"><b>${(noMes.length / dec).toFixed(1).replace(".", ",")}</b>Média diária (mês)</div></div>
    <p class="mut peq">Entregas por dia — ${MESES[m - 1]} ${y}</p><div class="graf">${por.map((v, i) => `<i style="height:${v / max * 100}%" title="Dia ${i + 1}: ${v}"></i>`).join("")}</div>`;
    root.querySelector("#r-d").onchange = e => { if (e.target.value) { dia = e.target.value; mes = dia.slice(0, 7); draw(); } };
    root.querySelector("#r-m").onchange = e => { if (e.target.value) { mes = e.target.value; draw(); } };
  };
  draw(); return draw;
}

// ===================== 7. NOVA ENTREGA =====================

const posicao = () => new Promise((ok, er) => {
  if (!navigator.geolocation) return er(new Error("Este navegador não oferece localização."));
  navigator.geolocation.getCurrentPosition(
    p => ok({latitude: p.coords.latitude, longitude: p.coords.longitude, accuracyMeters: Math.round(p.coords.accuracy)}),
    e => er(new Error(e.code === 1 ? "Permissão de localização negada. Permita a localização para este site nas configurações do navegador (iPhone: Ajustes > Privacidade e Segurança > Serviços de Localização > Safari) e tente novamente."
      : e.code === 3 ? "Tempo esgotado ao obter a localização. Vá para um local aberto e tente novamente." : "Não foi possível obter a localização.")),
    {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
});

function abrirNova(perfil, lista, aoSalvar, dataSel) {
  let tipo = "standard", arquivo = null, obs = "", dataOc = dataSel || isoData(new Date()), hora = "08:00", msg = "";
  const s = abrirModal("");
  const nomePadrao = () => tipo === "special" ? "Entrega Especial" : `Entrega ${lista.filter(d => d.deliveryType === "standard" && d.deliveryDate === isoData(new Date())).length + 1}`;
  let nome = nomePadrao();
  const draw = () => {
    const e = tipo === "special";
    s.innerHTML = `<div class="tabs"><button data-t="standard" class="${e ? "" : "on"}">Entrega Padrão</button><button data-t="special" class="${e ? "on e" : ""}">Entrega Especial</button></div>
    ${e ? '<p class="aviso"><b>ENTREGA ESPECIAL — REGISTRO RETROATIVO.</b> Para entregas já realizadas e não registradas na hora. Data e horário abaixo são informados por você; o instante real do registro é guardado separadamente.</p>' : '<p class="aviso az">Data, horário e localização serão capturados automaticamente ao salvar.</p>'}
    <label>Nome da entrega<input id="n-nome" value="${esc(nome)}"></label>
    ${e ? `<label>Data da ocorrência<input type="date" id="n-data" value="${dataOc}"></label><label>Horário<input type="time" id="n-hora" value="${hora}"></label>
    <label>Observações (opcional)<textarea id="n-obs" rows="2">${esc(obs)}</textarea></label>` : ""}
    <label class="btn" for="f-cam">📷 ${arquivo ? "Tirar outra fotografia" : "Tirar fotografia"}</label>
    <input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
    ${e ? '<label class="btn" for="f-gal">🖼 Escolher da galeria</label><input type="file" id="f-gal" accept="image/*" hidden>' : ""}
    ${arquivo ? '<img class="prev" id="prev" alt="Prévia">' : '<p class="mut peq">A fotografia é obrigatória.</p>'}
    <p class="err" id="n-err">${esc(msg)}</p>
    <button class="btn pri" id="n-salvar">Salvar entrega</button><button class="btn" id="n-cancel">Cancelar</button>`;
    if (arquivo) s.querySelector("#prev").src = URL.createObjectURL(arquivo);
    s.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const antigo = nomePadrao(); guardar(); const trocou = nome === antigo; tipo = b.dataset.t; if (trocou) nome = nomePadrao(); msg = ""; draw(); });
    s.querySelectorAll("input[type=file]").forEach(i => i.onchange = () => { guardar(); if (i.files[0]) { arquivo = i.files[0]; msg = ""; draw(); } });
    s.querySelector("#n-cancel").onclick = fecharModal;
    s.querySelector("#n-salvar").onclick = salvar;
  };
  function guardar() { nome = s.querySelector("#n-nome").value; if (tipo === "special") { dataOc = s.querySelector("#n-data").value; hora = s.querySelector("#n-hora").value; obs = s.querySelector("#n-obs").value; } }
  async function salvar() {
    guardar(); const e = tipo === "special", btn = s.querySelector("#n-salvar"), er = s.querySelector("#n-err");
    const falha = m => { msg = m; er.textContent = m; btn.disabled = false; btn.textContent = "Salvar entrega"; };
    if (!nome.trim()) return falha("Informe o nome da entrega.");
    if (!arquivo) return falha("A fotografia é obrigatória.");
    if (e && (!dataOc || !hora)) return falha("Informe a data e o horário da ocorrência.");
    if (!navigator.onLine) return falha("Sem conexão com a internet. A entrega NÃO foi confirmada na nuvem.");
    btn.disabled = true; btn.textContent = "Obtendo localização e salvando…"; er.textContent = "";
    try {
      let loc = null;
      try { loc = await posicao(); } catch (x) { if (!e) throw x; toast(x.message + " O registro especial será salvo sem localização.", "warn"); }
      const agora = new Date();
      const dados = {deliveryName: nome.trim(), deliveryType: tipo, deviceCreatedAt: agora, notes: e ? obs.trim() : "",
        deliveryDate: e ? dataOc : isoData(agora), deliveryTime: e ? hora : horaHM(agora), occurredAt: e ? new Date(`${dataOc}T${hora}`) : agora,
        latitude: loc?.latitude ?? null, longitude: loc?.longitude ?? null, accuracyMeters: loc?.accuracyMeters ?? null, locationKind: loc ? (e ? "registro" : "entrega") : null};
      await salvarEntrega(perfil, dados, arquivo);
      fecharModal(); await aoSalvar();
      toast(e ? "Entrega especial registrada com sucesso! Os dados informados foram salvos." + (loc ? " A localização do momento do registro também." : "")
        : "Entrega registrada com sucesso! Fotografia, data, horário e localização foram registrados.");
    } catch (x) { falha(msgErro(x) + " A entrega NÃO foi confirmada. Você pode tentar novamente."); }
  }
  draw();
}

function montarAjustes(root) {                     // não faz nenhuma consulta ao banco
  root.onclick = null;
  root.innerHTML = `<h2>Ajustes</h2><div class="box"><b>${esc(perfil.nome)}</b><br>${esc(perfil.email)}<br><span class="mut">${esc(perfil.empresa)}</span></div>

  root.querySelector("#aj-sair").onclick = sairDaConta;
}
async function sairDaConta() {
  try { await encerrarAdmin(); } catch {}
  try { await sair(); } catch (e) { toast(msgErro(e), "err"); }
}
function pedirSenhaAdmin(root) {
  const s = abrirModal(`<h2>Administrador</h2><label>Senha<input type="password" id="pin" inputmode="numeric" autocomplete="off"></label><p class="err" id="pin-e"></p>
    <button class="btn pri" id="pin-ok">Entrar</button><button class="btn" id="pin-x">Cancelar</button>`);
  const entrarAdmin = async () => {
    const b = s.querySelector("#pin-ok"), e = s.querySelector("#pin-e"); b.disabled = true; b.textContent = "Verificando…"; e.textContent = "";

  };

function abrirPainel(root) {
  const base = corpo => {
    root.onclick = null;
    root.innerHTML = `<button class="btn red" id="p-sair">🔒 Sair do painel</button>${corpo}`;
    root.querySelector("#p-sair").onclick = async () => { await encerrarAdmin(); montarAjustes(root); };
  };
  const falha = (e, tentar) => {
    if (!adminAtivo()) { toast(msgErro(e), "warn"); montarAjustes(root); return; }
    base(`<p class="err">${esc(e?.code === "permission-denied" ? "O servidor negou a consulta administrativa (regras não publicadas ou autorização expirada)." : msgErro(e))}</p><button class="btn pri" id="p-tent">Tentar novamente</button>`);
    root.querySelector("#p-tent").onclick = tentar;
  };
  const listaFuncionarios = async forcar => {
    base('<p class="vazio">Carregando funcionários…</p>');
    try {
      const us = await admCarregarUsuarios(forcar); if (!us) return;
      base("<h2>Funcionários</h2>" + (us.map(u => `<div class="box"><b>${esc(u.nome)}</b><br>${esc(u.email)}<br><span class="mut">${esc(u.empresa)}</span><br>
        <span data-c="${esc(u.uid)}" class="mut">contando entregas…</span><button class="btn pri" data-u="${esc(u.uid)}">Ver registros</button></div>`).join("") || '<p class="vazio">Nenhum funcionário.</p>'));
      root.onclick = e => { const b = e.target.closest("[data-u]"); if (b) funcionario(us.find(x => x.uid === b.dataset.u)); };
      us.forEach(u => admContar(u.uid).then(n => { const el = root.querySelector(`[data-c="${u.uid}"]`); if (el && n !== null) el.textContent = `${n} entrega(s)`; })
        .catch(() => { const el = root.querySelector(`[data-c="${u.uid}"]`); if (el) el.textContent = "contagem indisponível"; }));
    } catch (e) { falha(e, () => listaFuncionarios(true)); }
  };
  const funcionario = async (u, mais) => {
    base('<p class="vazio">Carregando registros…</p>');
    try {
      const e = await admCarregarEntregas(u.uid, mais); if (!e) return;
      base(`<button class="btn" id="p-lista">‹ Funcionários</button><h2>${esc(u.nome)}</h2><p class="mut">${esc(u.empresa)} · ${esc(u.email)}</p>
        <p class="mut peq">${e.lista.length} registro(s) carregado(s)${e.fim ? "" : " — há mais registros"}</p>${e.fim ? "" : '<button class="btn" id="p-mais">Carregar mais registros</button>'}
        <div id="ag"></div><div id="rs"></div><button class="btn" id="p-atual">↻ Atualizar este funcionário</button>`);
      montarAgenda(root.querySelector("#ag"), e.lista, {admin: true}); montarResumo(root.querySelector("#rs"), e.lista);
      root.querySelector("#p-lista").onclick = () => listaFuncionarios(false);
      root.querySelector("#p-atual").onclick = () => { admDados.delete(u.uid); admContagens.delete(u.uid); funcionario(u); };
      const m = root.querySelector("#p-mais"); if (m) m.onclick = () => funcionario(u, true);
    } catch (err) { falha(err, () => funcionario(u, mais)); }
  };
  listaFuncionarios(false);
}

// ===================== NAVEGAÇÃO, HISTÓRICO E TELAS DE LOGIN =====================

let perfil = null, lista = [], registrando = false, visao = "agenda", redesenhar = {};

const mostrar = id => {
  for (const x of ["auth", "app"]) $("#" + x).hidden = x !== id;
  if (id === "auth") { $("#a-home").hidden = false; $("#f-cad").hidden = true; $("#f-log").hidden = true; }   // sempre volta à tela inicial
};
function irPara(v) {
  if (visao === "cfg") encerrarAdmin().catch(() => {});   // saiu (ou tocou de novo) em Ajustes: bloqueia o painel
  visao = v;
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + v);

function desenhar() {

async function recarregar() { lista = await listarMinhas(perfil.uid); desenhar(); }

function historico() {
  const r = $("#v-hist"), f = {q: "", tipo: "", de: "", ate: ""};
  const draw = () => {
    const l = lista.filter(d => (!f.q || d.deliveryName.toLowerCase().includes(f.q.toLowerCase())) && (!f.tipo || d.deliveryType === f.tipo) && (!f.de || d.deliveryDate >= f.de) && (!f.ate || d.deliveryDate <= f.ate)).sort(ordenar);
    $("#h-lst").innerHTML = `<p class="mut peq">${l.length} registro(s), mais recentes primeiro (pela data da ocorrência)</p>` + (l.map(cartao).join("") || '<p class="vazio">Nada encontrado.</p>');
    miniaturas($("#h-lst"));
  };
  r.innerHTML = `<h2>Histórico</h2><label>Buscar pelo nome<input id="h-q" type="search"></label>
  <label>Tipo<select id="h-t"><option value="">Todos</option><option value="standard">Entrega Padrão</option><option value="special">Entrega Especial</option></select></label>
  <div class="row"><label style="flex:1">De<input type="date" id="h-de"></label><label style="flex:1">Até<input type="date" id="h-ate"></label></div><div id="h-lst"></div>`;
  r.querySelector("#h-q").oninput = e => { f.q = e.target.value; draw(); };
  r.querySelector("#h-t").onchange = e => { f.tipo = e.target.value; draw(); };
  r.querySelector("#h-de").onchange = e => { f.de = e.target.value; draw(); };
  r.querySelector("#h-ate").onchange = e => { f.ate = e.target.value; draw(); };
  r.onclick = e => acaoCartao(e, lista, draw);
  draw();
}

async function iniciar(u) {
  perfil = await carregarPerfil(u.uid);
  if (!perfil) { toast("Perfil não encontrado. Fale com o administrador.", "err"); await sair(); return; }
  $("#quem").textContent = `${perfil.nome} · ${perfil.empresa}`;
  mostrar("app"); lista = await listarMinhas(u.uid); irPara("agenda");
}


// ----- telas de autenticação -----
const fs = {cad: $("#f-cad"), log: $("#f-log")};
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
  $("#a-home").hidden = b.dataset.go !== "home"; fs.cad.hidden = b.dataset.go !== "cad"; fs.log.hidden = b.dataset.go !== "log";
});
async function comEspera(btn, fn) {
  btn.disabled = true;
  erroAuth("");
  try { await fn(); } catch (e) { registrando = false; erroAuth(msgErro(e)); } finally { btn.disabled = false; }
}
fs.cad.onsubmit = e => { e.preventDefault(); const v = Object.fromEntries(new FormData(fs.cad));
  comEspera(fs.cad.querySelector(".pri"), async () => { registrando = true; await cadastrar(v.nome.trim(), v.email.trim(), v.senha, v.empresa.trim()); registrando = false; await iniciar(auth.currentUser); }); };
fs.log.onsubmit = e => { e.preventDefault(); const v = Object.fromEntries(new FormData(fs.log)); comEspera(fs.log.querySelector(".pri"), () => entrar(v.email.trim(), v.senha)); };
$("#b-rec").onclick = () => {
  const email = fs.log.email.value.trim(); if (!email) return toast("Digite seu e-mail para receber o link de redefinição.", "warn");
  comEspera($("#b-rec"), async () => { await recuperarSenha(email); toast("Se o e-mail estiver cadastrado, enviamos o link de redefinição."); });
};
$("#b-sair").onclick = sairDaConta;
document.querySelectorAll(".bar button").forEach(b => b.onclick = () => irPara(b.dataset.v));

// ===================== 9. INICIALIZAÇÃO GERAL =====================
function limparSessaoVisual() {                   // impede reaproveitar visualmente dados da conta anterior
  perfil = null; lista = []; visao = "agenda"; bloquearAdminLocal(); admSessao = false; fotos.clear(); fecharModal();
  document.querySelectorAll(".view").forEach(v => v.innerHTML = ""); $("#quem").textContent = "";
}
const erroAuth = m => { $("#a-err").textContent = m || ""; };
async function bootstrap() {
  $("#a-status").textContent = "Conectando ao Firebase…";
  try { await iniciarFirebase(); }
  catch (e) { $("#a-status").textContent = ""; erroAuth(e.message || msgErro(e)); return; }   // login continua visível
  $("#a-status").textContent = "";
  aoMudarSessao(async u => {
    if (registrando) return;
    if (!u) { limparSessaoVisual(); mostrar("auth"); return; }
    try { await iniciar(u); }
    catch (e) { mostrar("auth"); erroAuth("Você está autenticado, mas não foi possível carregar seus dados (" + msgErro(e) + "). Verifique a conexão e as regras do Firestore e tente novamente."); }
  });
}
bootstrap();
